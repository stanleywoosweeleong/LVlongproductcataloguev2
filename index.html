{id:'LV001',code:'LV001',pkg:'20 kg',cat:'Macronutrients',tag:'macro',en_name:'12-Element 19-19-19',zh_name:'十二元素 19-19-19',en_tag:'Multi-element, fully water-soluble, full-cycle applicable',zh_tag:'多元素同补，全水溶易吸收，全周期适用',en_ingr:'N 19%, P 19%, K 19%, Amino acids 8000ppm, Ca 4800ppm, Mg 3200ppm, Fe/Zn/Mn/Cu/B/Mo, Vitamins 800ppm',zh_ingr:'氮19%，磷19%，钾19%，氨基酸8000ppm，钙4800ppm，镁3200ppm，铁/锌/锰/铜/硼/钼，维生素800ppm',en_bene:'Balanced formula for the full growth cycle. Promotes growth, anti-salt, anti-drought. Promotes flower bud differentiation and fruit set.',zh_bene:'采用平衡型配方，适合作物生长全周期使用。具有促生、抗盐、抗旱等功能。促进花芽分化，提高坐果率。',en_meth:[['Foliar','Dilute 800-1000x, spray 5-8 times, every 10-15 days'],['Drip/Flood',kga(5,8)+', dilute 500-800x, every 7-10 days']],zh_meth:[['喷施','稀释800-1000倍喷施，喷5-8次，每次间隔10-15天'],['冲施/滴灌',kgaz(5,8)+'，稀释500-800倍，每次间隔7-10天']],en_prec:'Avoid spraying in windy conditions or at hot midday. Leaves should be moist but not dripping; re-apply if rain occurs within 4 hours. Product may cake after opening -- no effect on performance. Do not mix with alkaline products. Store sealed in cool dry place, away from food and children.',zh_prec:'叶面喷施应避开大风天气及中午炎热时段，以茎叶湿润但不流为准，4小时内遇雨应重新喷施。打开包装后产品容易吸潮结块，但不影响效果。禁止与碱性类产品混用，以免影响肥效。本品无毒无害，密封储存于阴凉干燥处，但仍需远离食品和儿童。'},
{id:'LV002',code:'LV002',pkg:'1 kg',cat:'Macronutrients',tag:'macro',en_name:'12-Element 19-19-19',zh_name:'十二元素 19-19-19',en_tag:'Multi-element, fully water-soluble, full-cycle applicable',zh_tag:'多元素同补，全水溶易吸收，全周期适用',en_ingr:'N 19%, P 19%, K 19%, Amino acids 8000ppm, Ca 4800ppm, Mg 3200ppm, Fe/Zn/Mn/Cu/B/Mo, Vitamins 800ppm',zh_ingr:'氮19%，磷19%，钾19%，氨基酸8000ppm，钙4800ppm，镁3200ppm，铁/锌/锰/铜/硼/钼，维生素800ppm',en_bene:'Balanced formula for the full growth cycle. Promotes growth, anti-salt, anti-drought. Promotes flower bud differentiation and fruit set.',zh_bene:'采用平衡型配方，适合作物生长全周期使用。具有促生、抗盐、抗旱等功能。促进花芽分化，提高坐果率。',en_meth:[['Foliar','Dilute 800-1000x, spray 5-8 times, every 10-15 days'],['Drip/Flood',kga(5,8)+', dilute 500-800x, every 7-10 days']],zh_meth:[['喷施','稀释800-1000倍喷施，喷5-8次，每次间隔10-15天'],['冲施/滴灌',kgaz(5,8)+'，稀释500-800倍，每次间隔7-10天']],en_prec:'Avoid spraying in windy conditions or at hot midday. Leaves should be moist but not dripping; re-apply if rain occurs within 4 hours. Product may cake after opening -- no effect on performance. Do not mix with alkaline products. Store sealed in cool dry place, away from food and children.',zh_prec:'叶面喷施应避开大风天气及中午炎热时段，以茎叶湿润但不流为准，4小时内遇雨应重新喷施。打开包装后产品容易吸潮结块，但不影响效果。禁止与碱性类产品混用，以免影响肥效。本品无毒无害，密封储存于阴凉干燥处，但仍需远离食品和儿童。'},
{id:'LV003',code:'LV003',pkg:'20 kg',cat:'Macronutrients',tag:'macro',en_name:'MKP Monopotassium Phosphate',zh_name:'磷酸二氢钾 MKP',en_tag:'Promotes flowering and fruiting, improves fruit set rate',zh_tag:'促花促果，提升坐果率',en_ingr:'P2O5 52%, K2O 34%, Purity 99%',zh_ingr:'五氧化二磷52%，氧化钾34%，纯度99%',en_bene:'Fast-acting phosphorus and potassium. Promotes flower bud differentiation, reduces flower and fruit drop. Promotes fruit enlargement, coloring and sugar accumulation.',zh_bene:'速效补磷、补钾。促进花芽分化、保花保果，减少落花落果。促进果实膨大、上色、增糖，提高果实品质。',en_meth:[['Foliar','Dilute 500-1000x, 2-3 times, every 10-15 days'],['Root drench',kga(2,5)+', dilute 1000-2000x'],['Drip/Flood',kga(2,4)+', dilute 1000-2000x']],zh_meth:[['喷施','稀释500-1000倍叶面喷施，可连续2-3次，每次间隔10-15天'],['灌根',kgaz(2,5)+'，稀释1000-2000倍'],['冲施/滴灌',kgaz(2,4)+'，稀释1000-2000倍']],en_prec:'Best applied before 10 am or after 4 pm. Can be tank-mixed with acidic or neutral pesticides to improve efficacy; do not mix with alkaline substances. Product is fully water-soluble and may cake after moisture exposure -- does not affect performance. Store in cool dry ventilated place; reseal after use.',zh_prec:'宜选在上午10点前、下午4点后喷施。本品可与酸性、中性农药混合施用，增加药效，不能与碱性物质混用。本品属全水溶肥料，吸潮后易结块，不影响使用效果。请贮存于阴凉干燥通风处，开袋未使用完请密封。'},
{id:'LV004',code:'LV004',pkg:'1 kg',cat:'Macronutrients',tag:'macro',en_name:'MKP Monopotassium Phosphate',zh_name:'磷酸二氢钾 MKP',en_tag:'Promotes flowering and fruiting, improves fruit set rate',zh_tag:'促花促果，提升坐果率',en_ingr:'P2O5 52%, K2O 34%, Purity 99%',zh_ingr:'五氧化二磷52%，氧化钾34%，纯度99%',en_bene:'Fast-acting phosphorus and potassium. Promotes flower bud differentiation, reduces flower and fruit drop. Promotes fruit enlargement, coloring and sugar accumulation.',zh_bene:'速效补磷、补钾。促进花芽分化、保花保果，减少落花落果。促进果实膨大、上色、增糖，提高果实品质。',en_meth:[['Foliar','Dilute 500-1000x, 2-3 times, every 10-15 days'],['Root drench',kga(2,5)+', dilute 1000-2000x'],['Drip/Flood',kga(2,4)+', dilute 1000-2000x']],zh_meth:[['喷施','稀释500-1000倍叶面喷施，可连续2-3次，每次间隔10-15天'],['灌根',kgaz(2,5)+'，稀释1000-2000倍'],['冲施/滴灌',kgaz(2,4)+'，稀释1000-2000倍']],en_prec:'Best applied before 10 am or after 4 pm. Can be tank-mixed with acidic or neutral pesticides to improve efficacy; do not mix with alkaline substances. Product is fully water-soluble and may cake after moisture exposure -- does not affect performance. Store in cool dry ventilated place; reseal after use.',zh_prec:'宜选在上午10点前、下午4点后喷施。本品可与酸性、中性农药混合施用，增加药效，不能与碱性物质混用。本品属全水溶肥料，吸潮后易结块，不影响使用效果。请贮存于阴凉干燥通风处，开袋未使用完请密封。'},
{id:'LV008',code:'LV008',pkg:'20 kg',cat:'Macronutrients',tag:'macro',en_name:'High Nitrogen 30-10-10+TE',zh_name:'高氮大量元素 30-10-10+TE',en_tag:'Nitrogen-rich for strong seedling growth and lush leaves',zh_tag:'氮足苗壮，苗旺叶绿',en_ingr:'Total NPK 50%, Nitrate N 6%, Mineral fulvic acid 1%, Zn+B 0.2%+',zh_ingr:'氮磷钾总养分50%，硝态氮6%，矿源黄腐酸1%，Zn+B0.2%+',en_bene:'30% nitrogen for fast growth stimulus. EDTA chelated microelements (Fe, Zn, Mn, Cu, B, Mo). Multi-form nitrogen for fast uptake and sustained supply.',zh_bene:'含氮量高达30%，促长提苗见效快。富含EDTA螯合微量元素，预防黄叶、白化。含硝态氮+铵态氮+脲态氮，满足快吸收+持续供氮双重需求。',en_meth:[['Drip/Flood',kga(5,10)+' -- seedling/fast growth period'],['Foliar','Dilute 600-800x']],zh_meth:[['冲施/滴灌',kgaz(5,10)+'（苗期、快速营养生长期）'],['叶面喷施','600-800倍稀释']],en_prec:'Contains biuret -- improper use can harm crops. Do not mix with alkaline products. Product may cake after opening -- does not affect performance. Non-toxic; store sealed in cool dry place away from food and children.',zh_prec:'含缩二脲，使用不当会对作物造成伤害。禁止与碱性类产品混用，以免影响肥效。打开包装后产品容易吸潮结块，但不影响效果。本品无毒无害，密封储存于阴凉干燥处，但仍需远离食品和儿童。'},
{id:'LV009',code:'LV009',pkg:'20 kg',cat:'Macronutrients',tag:'macro',en_name:'High Phosphorus 10-50-6+TE',zh_name:'高磷大量元素 10-50-6+TE',en_tag:'Promotes flower bud differentiation and fruit set',zh_tag:'促进花芽分化、提高坐果率，提高抗性',en_ingr:'Total nutrients 66%+, Zn+B 0.2%+',zh_ingr:'总养分66%+，Zn+B0.2%+',en_bene:'Medium N, high P, low K formula. Zinc and boron promote flower bud differentiation. Added inositol improves stress tolerance.',zh_bene:'中氮、高磷、低钾配方，水溶性好。微量元素锌、硼能促进花芽分化，减少落花落果。特别添加肌醇，可提高作物对逆境的抵御能力。',en_meth:[['Foliar','Dilute 500-800x, every 10-15 days'],['Drip/Flood','Flowering: '+kga(5,10)+' / Enlargement: '+kga(4,6)]],zh_meth:[['叶面喷施','兑水稀释500-800倍，需避开高温，间隔10-15天'],['冲施/滴灌','开花期：'+kgaz(5,10)+'；膨果期：'+kgaz(4,6)]],en_prec:'Do not mix with strong acid/alkali or high-calcium products to avoid affecting fertiliser efficacy. Improper fertiliser use can harm crops -- apply at recommended rates. Store sealed in cool dry place; use quickly after opening. Keep away from pregnant women, children and food.',zh_prec:'避免与强酸强碱性类或高钙类产品混用，以免影响肥效。肥料类产品使用不当会对作物造成伤害，请合理使用。密封储存于阴凉干燥处，开封后请尽快使用。请远离孕妇和儿童，避免食品污染。'},
{id:'LV010',code:'LV010',pkg:'20 kg',cat:'Macronutrients',tag:'macro',en_name:'High Potassium 16-6-36+TE',zh_name:'高钾大量元素 16-6-36+TE',en_tag:'Fruit enlargement, sweetness and crack prevention',zh_tag:'膨果期用高钾型，果实膨大，增甜抗裂',en_ingr:'Total NPK 50%, Nitrate N 6%, Mineral fulvic acid 1%, Zn+B 0.2%+',zh_ingr:'氮磷钾总养分50%，硝态氮6%，矿源黄腐酸1%，Zn+B0.2%+',en_bene:'36% potassium promotes carbohydrate synthesis. Faster fruit enlargement, better color, fewer cracked fruits.',zh_bene:'钾含量高达36%，果大皮靓糖分足。高钾促进细胞分裂与膨大，果实膨果速度快，色泽更鲜亮，减少裂果。',en_meth:[['Drip/Flood',kga(5,10)+' -- fruit enlargement and coloring period'],['Foliar','Dilute 600-800x']],zh_meth:[['冲施/滴灌',kgaz(5,10)+'（膨果期、着色期）'],['叶面喷施','600-800倍稀释']],en_prec:'Avoid spraying in windy conditions or at hot midday; re-apply if rain occurs within 4 hours. Contains biuret -- improper use can harm crops. Do not mix with alkaline products. After opening, colour may darken slightly and a faint odour may appear -- this is normal after moisture absorption and does not affect performance. Store sealed in cool dry place away from food and children.',zh_prec:'叶面喷施应避开大风天气及中午炎热时段，以茎叶湿润但不流为准，4小时内遇雨应重新喷施。含缩二脲，使用不当会对作物造成伤害。禁止与碱性类产品混用，以免影响肥效。打开包装后产品容易吸潮结块，若有颜色变深、略有刺鼻气味，为吸潮后正常现象，不影响使用效果。本品无毒无害，密封储存于阴凉干燥处，但仍需远离食品和儿童。'},
{id:'LV011',code:'LV011',pkg:'20 kg',cat:'Macronutrients',tag:'macro',en_name:'Balanced 20-20-20+TE',zh_name:'平衡大量元素 20-20-20+TE',en_tag:'Stable growth, stable flowering, stable fruiting',zh_tag:'稳长、稳花、稳果',en_ingr:'Total NPK 60%, Nitrate N 3%, Mineral fulvic acid 1%+, Zn+B 0.2%+',zh_ingr:'氮磷钾总养分60%，硝态氮3%，矿源黄腐酸1%+，Zn+B0.2%+',en_bene:'Balanced N-P-K for all growth stages. EDTA chelated Fe, Zn, Mn, Cu, B, Mo. High nutrient conversion efficiency.',zh_bene:'三元营养均衡，作物全面补给不偏科。添加EDTA螯合铁、锌、锰、铜+硼+钼，易吸收利用率高。营养转化效率高，见效快、肥效稳。',en_meth:[['Drip/Flood',kga(5,10)+' -- seedling, flowering, early fruiting'],['Foliar','Dilute 600-800x -- entire growth period']],zh_meth:[['冲施/滴灌',kgaz(5,10)+'（苗期、花期、挂果初期）'],['叶面喷施','600-800倍稀释（全生育期均可使用）']],en_prec:'Contains biuret -- improper use can harm crops. Do not mix with alkaline products. Product may cake after opening -- does not affect performance. Non-toxic; store sealed in cool dry place away from food and children.',zh_prec:'含缩二脲，使用不当会对作物造成伤害。禁止与碱性类产品混用，以免影响肥效。打开包装后产品容易吸潮结块，但不影响效果。本品无毒无害，密封储存于阴凉干燥处，但仍需远离食品和儿童。'},
{id:'LV012',code:'LV012',pkg:'1 kg',cat:'Macronutrients',tag:'macro',en_name:'High Phosphorus 10-50-6+TE',zh_name:'绿陇花 10-50-6+TE',en_tag:'Promotes flower bud differentiation and fruit set',zh_tag:'促进花芽分化、提高坐果率，提高抗性',en_ingr:'Total nutrients 66%+, Zn+B 0.2%+',zh_ingr:'总养分66%+，Zn+B0.2%+',en_bene:'Medium N, high P, low K formula. Zinc and boron promote flower bud differentiation. Added inositol improves stress tolerance.',zh_bene:'中氮、高磷、低钾配方，水溶性好。微量元素锌、硼能促进花芽分化，减少落花落果。特别添加肌醇，可提高作物对逆境的抵御能力。',en_meth:[['Foliar','Dilute 500-800x, every 10-15 days'],['Drip/Flood','Flowering: '+kga(5,10)+' / Enlargement: '+kga(4,6)]],zh_meth:[['叶面喷施','兑水稀释500-800倍，需避开高温，间隔10-15天'],['冲施/滴灌','开花期：'+kgaz(5,10)+'；膨果期：'+kgaz(4,6)]],en_prec:'Do not mix with strong acid/alkali or high-calcium products to avoid affecting fertiliser efficacy. Improper fertiliser use can harm crops -- apply at recommended rates. Store sealed in cool dry place; use quickly after opening. Keep away from pregnant women, children and food.',zh_prec:'避免与强酸强碱性类或高钙类产品混用，以免影响肥效。肥料类产品使用不当会对作物造成伤害，请合理使用。密封储存于阴凉干燥处，开封后请尽快使用。请远离孕妇和儿童，避免食品污染。'},
{id:'LV013',code:'LV013',pkg:'1 kg',cat:'Macronutrients',tag:'macro',en_name:'Lv Long Jia 13-7-40+TE',zh_name:'绿陇甲 13-7-40+TE',en_tag:'Fast fruit enlargement, high sweetness and color',zh_tag:'硝态氮含量高，膨果速度快，增甜上色',en_ingr:'N 13%, P 7%, K 40%, vitamins + microelements + chelated nutrients',zh_ingr:'氮13%，磷7%，钾40%，添加维生素+微量元素+螯合态营养成分',en_bene:'40% potassium for fruit enlargement, coloring, sweetness and firmness. Balanced N and P. Vitamin active factors enhance stress resistance.',zh_bene:'高钾配方，钾含量高达40%，有助于果实膨大、上色、提高甜度与硬度。氮磷平衡，营养全面，促进植株健壮。添加维生素活性因子，提高植物抗逆力。',en_meth:[['Foliar','Dilute 800-1000x, 3-5 times, every 10-15 days'],['Drip/Flood',kga(4,8)+' -- best in mid-to-late fruit enlargement']],zh_meth:[['喷施','稀释800-1000倍，喷施3-5次，每次间隔10-15天'],['冲施/滴灌',kgaz(4,8)+'，推荐在膨果中后期使用，效果更佳']],en_prec:'Do not spray at noon or in direct sunlight -- may burn leaves. Dilute correctly: ~800-1000x; excessive concentration will harm roots and leaves. Do not mix with strong acid, strong alkali or calcium-containing fertilisers. Store in cool dry place to prevent caking or deterioration. Wear gloves when mixing; avoid ingestion or eye contact.',zh_prec:'避免高温使用，不要在中午或烈日下喷施，以免灼伤叶片。正确稀释，喷施时稀释约800–1000倍，浓度过高会伤根或伤叶。不要与强酸、强碱或含钙肥料混用。储存防潮防晒，放在阴凉干燥处，避免结块或变质。配肥时戴手套，避免入口或接触眼睛。'},
{id:'LV045',code:'LV045',pkg:'20 kg',cat:'Macronutrients',tag:'macro',en_name:'Fast-Dissolving Potassium Sulfate',zh_name:'速溶硫酸钾',en_tag:'High purity chlorine-free potassium, improves fruit quality',zh_tag:'高纯无氯钾肥，提升果实品质',en_ingr:'K2SO4 (potassium sulfate), high purity, chlorine-free',zh_ingr:'硫酸钾（K2SO4），高纯度，无氯',en_bene:'Quick-dissolving sulfate of potash -- chlorine-free, suitable for chloride-sensitive crops. Improves fruit quality, sweetness and color. Provides both potassium and sulfur nutrition.',zh_bene:'快速溶解的硫酸钾，无氯，适合忌氯作物。改善果实品质、增甜、促进上色。同时提供钾素和硫素营养。',en_meth:[['Drip/Flood',kga(5,15)+' per application'],['Base/Top dressing',kga(10,30)]],zh_meth:[['冲施/滴灌',kgaz(5,15)+'每次'],['底肥/追肥',kgaz(10,30)]],en_prec:'Do not mix with calcium products to avoid precipitation.',zh_prec:'避免与钙肥混用，防止产生沉淀。'},
{id:'LV016',code:'LV016',pkg:'1 L',cat:'MicroElements',tag:'micro',en_name:'Lv Long Peng (Boron + Seaweed)',zh_name:'绿陇朋（硼）',en_tag:'Improve fruit set, fast boron supplement',zh_tag:'提高座果率，促果膨果美果，快速补硼',en_ingr:'B 150g/L+, Seaweed extract 200g/L+, Brown algae oligosaccharide 4g/L+',zh_ingr:'硼(B)150g/L+，海藻提取物200g/L+，褐藻寡糖4g/L+',en_bene:'Promotes cell division and elongation. Boron improves pollen vitality and fruit set rate. Improves resistance to drought and high temperature. High water solubility for rapid absorption.',zh_bene:'硼能促进细胞分裂与伸长，使根系更发达、吸收力更强。促进花粉活力、提高坐果率。改善作物对干旱、高温、病害的抵抗能力。水溶性高，吸收快。',en_meth:[['Foliar','Dilute 750-1500x, every 10-14 days']],zh_meth:[['叶面喷施','稀释750-1500倍，每两次使用间隔10-14天']],en_prec:'Adjust usage rate based on local soil boron levels. Do not spray in direct sunlight. When mixing with products of unknown composition, use caution; follow this order: water first, then this product, then other products. Store in cool dry place away from children and pregnant women; avoid food contamination; handle carefully during transport to avoid damage.',zh_prec:'根据当地土壤硼含量，酌情使用本品。请勿在阳光直射时喷施本品。与成分不明的其他类产品慎重混用，混配遵循以下顺序：水、本品、其他产品。存放阴凉干燥处，避免儿童、孕妇接触或污染食品，运输过程中避免雨淋、挤压、碰撞。'},
{id:'LV022',code:'LV022',pkg:'5 kg',cat:'MicroElements',tag:'micro',en_name:'Ca-Mg-B-Zn-Fe (5-in-1)',zh_name:'钙镁硼锌铁',en_tag:'5-element combo: prevent cracking, beautify fruit',zh_tag:'五元素同补，膨果防裂果，美化果型，提高品质',en_ingr:'Ca 130g, B 1g, Fe 1g, Zn 10g, Mg 10g, Amino acid 50g',zh_ingr:'钙130g，硼1g，铁1g，锌10g，镁10g，氨基酸50g',en_bene:'Ca prevents cracking, improves firmness. B promotes flower bud differentiation. Zn promotes auxin synthesis. Fe improves chlorosis. Mg is the core of chlorophyll.',zh_bene:'钙：防止裂果、提高果实硬度和耐储运性。硼：促进花粉活力、花芽分化和坐果率。锌：促进生长素合成，增强生长活力。铁：改善黄化症，促进叶绿素形成。镁：构成叶绿素核心，提升光合作用效率。',en_meth:[['Foliar','Dilute 500-1000x, post-flower to harvest, every 10-15 days'],['Drip/Flood',kga(2,5)]],zh_meth:[['叶面喷施','稀释500-1000倍，用于花后、坐果期、膨果期、采前阶段，每次间隔10-15天'],['冲施/滴灌',kgaz(2,5)]],en_prec:'Shake well before use; dilute at correct ratio. Do not mix with phosphate or strong alkaline fertilisers. Apply in the morning or evening; avoid high temperatures and rain. Store in cool dry place; use promptly after opening. Stop use if abnormal leaf symptoms appear.',zh_prec:'使用前摇匀，按比例稀释。勿与磷酸盐或强碱性肥料混用。早晚喷施，避开高温与雨天。阴凉干燥处保存，开封后尽快用完。叶片出现异常应停用。'},
{id:'LV026',code:'LV026',pkg:'500 g',cat:'MicroElements',tag:'micro',en_name:'All-in-One Micro Elements',zh_name:'十全十美',en_tag:'10-element blend: improve taste, reduce deformity',zh_tag:'多元素同补，提升口感，减少畸形',en_ingr:'Free amino acid 10%, Ca 6%, Mg 4%, S 3%, Fe 2%, Zn 2%, B 1%, Mn 0.5%, Cu 0.5%, Mo 0.05%',zh_ingr:'游离氨基酸10%，钙6%，镁4%，硫3%，铁2%，锌2%，硼1%，锰0.5%，铜0.5%，钼0.05%',en_bene:'10 nutrients in one: corrects all element deficiencies. Contains high-activity amino acids to promote rooting, flower differentiation and fruit set. Enhances stress resistance.',zh_bene:'十全：氮磷钾+钙镁硼锌铁锰钼，中微量元素+功能因子一瓶全含。快速纠正各种元素缺乏问题。含高活性氨基酸和生根因子，促进花芽分化、提高坐果率。提升作物在高温、低温、干旱、药害、病虫胁迫下的恢复力。',en_meth:[['Foliar','Dilute 1000-1500x, or dissolve 15-30g in 15 L water'],['Drip/Flood',ga(500,1000)+' per application, double-dilute before use']],zh_meth:[['叶面喷施','稀释1000-1500倍均匀喷施，或15L水兑本品15-30克'],['冲施/滴灌',gaz(500,1000)+'/次，建议二次稀释后使用']],en_prec:'Can be mixed with weakly acidic or neutral pesticides and foliar fertilisers. Apply in clear weather in the morning or evening; avoid direct sunlight and high temperatures; re-apply if rain occurs within 4 hours. Dissolves slowly -- stir well; a paste-like consistency when dissolving is normal.',zh_prec:'本品可与弱酸性、中性农药及叶面肥混合使用。叶面喷施应在晴天清晨或者傍晚最佳，避免阳光直射和高温下使用，喷施四小时内遇雨应补喷。本品极易吸潮，比重大，溶解时容易沉底，成面糊状是正常，多搅拌一会儿即可溶解，建议边倒边搅拌，可以有效帮助溶解。'},
{id:'LV027',code:'LV027',pkg:'1 L',cat:'MicroElements',tag:'micro',en_name:'Lv Long Gai (Calcium)',zh_name:'绿陇盖（钙）',en_tag:'Improve stress resistance, prevent cracking, beautiful fruit',zh_tag:'提高抗性，防裂增重，叶健果靓，提升口感',en_ingr:'Ca 100g/L+, Mg 25g/L+, B+Fe+Zn 5g/L+, Algal sugars 15g/L+, Mannitol 45g/L+',zh_ingr:'Ca100g/L+，Mg25g/L+，B+Fe+Zn5g/L+，藻真糖15g/L+，甘露醇45g/L+',en_bene:'High-activity chelated calcium for superior leaf and fruit absorption. Calcium strengthens cell walls -- increases fruit firmness and shelf life.',zh_bene:'绿陇盖中的钙元素为螯合态或糖醇结合态，具备更强的叶片渗透性和植物吸收性，可迅速被叶片、果实吸收。钙是细胞壁的骨架元素，充足的钙使果肉细胞排列紧密，果实硬度增加、耐储运。',en_meth:[['Foliar','Dilute 1000-1500x, every 10-15 days'],['Drip/Flood','6-12 L/acre; young fruit to expansion stage, every 7-10 days'],['Drip/Flood',la(1,2)+' -- young fruit to enlargement stage, every 7-10 days']],zh_meth:[['叶面喷施','兑水1000-1500倍，在作物各个时期均可使用，间隔期10-15天'],['滴灌/冲施',laz(1,2)+'，幼果至膨大期使用，间隔7-10天']],en_prec:'Store sealed in cool dry place; do not mix with strong acid or alkaline pesticides. Spray leaves uniformly; applying in clear weather in the morning or evening gives best results.',zh_prec:'密闭贮存于阴凉干燥处，避免与强酸、强碱性农药混用。叶片要均匀喷雾，晴天早晨或傍晚喷施效果更好。'},
{id:'LV030',code:'LV030',pkg:'1 L',cat:'MicroElements',tag:'micro',en_name:'Liquid Boron',zh_name:'流体硼',en_tag:'Fast boron supplement, promotes pollination, improves fruit set',zh_tag:'快速补硼，促进授粉，提高座果，籽粒饱满',en_ingr:'B 150g/L+',zh_ingr:'硼（B）150g/L+',en_bene:'High concentration, high purity liquid boron. Chelated form for fast absorption. Corrects boron deficiency symptoms rapidly. Absorption rate 3-5x higher than solid boron fertilizer. No crystallization, easy mixing.',zh_bene:'含有150g/L+有效硼，浓度高、纯度好。液体螯合态，喷施后迅速进入作物体内，快速纠正缺硼症状，如顶芽坏死、落花落果、果实畸形等。吸收率远高于传统固体硼肥，利用率提升3-5倍。不结晶、不沉淀、易混配。',en_meth:[['Foliar','Dilute 1000-1500x, every 10-15 days'],['Drip/Flood','6-12 L/acre (1-2 L per 亩); young fruit to expansion stage, every 7-10 days']],zh_meth:[['叶面喷施','兑水1000-1500倍，间隔期10-15天'],['冲施/滴灌','6-12L/英亩（幼果至膨大期，间隔7-10天）']],en_prec:'Adjust usage rate based on local soil boron levels. Do not spray in direct sunlight. When mixing with products of unknown composition, use caution; follow this order: water first, then this product, then other products.',zh_prec:'根据当地土壤硼含量，酌情使用本品。请勿在阳光直射时喷施本品。与成分不明的其他类产品慎重混用，混配遵循以下顺序：水、本品、其他产品。'},
{id:'LV041',code:'LV041',pkg:'500 g',cat:'MicroElements',tag:'micro',en_name:'You Le Gai (Premium Calcium)',zh_name:'优乐盖',en_tag:'Premium chelated calcium, improve fruit quality and shelf life',zh_tag:'优质螯合钙，改善果实品质，延长货架期',en_ingr:'Chelated calcium, trace elements',zh_ingr:'螯合钙，微量元素',en_bene:'High-activity chelated calcium for superior absorption. Strengthens cell walls to prevent cracking. Improves fruit firmness, shelf life and transport quality.',zh_bene:'高活性螯合钙，吸收效果优异。强化细胞壁，防止裂果。改善果实硬度、延长货架期和耐储运性。',en_meth:[['Foliar','Dilute 1000-1500x, every 10-15 days from young fruit to harvest'],['Drip/Flood','Apply during fruit enlargement']],zh_meth:[['叶面喷施','稀释1000-1500倍，幼果至采收期每10-15天一次'],['冲施/滴灌','膨果期施用']],en_prec:'Do not mix with phosphate or sulfate fertilizers.',zh_prec:'不可与磷酸盐或硫酸盐肥料混用。建议在清晨或傍晚气温较低时施用。'},
{id:'LV042',code:'LV042',pkg:'1 L',cat:'MicroElements',tag:'micro',en_name:'Sugar Alcohol Calcium',zh_name:'糖醇钙',en_tag:'Sugar-alcohol chelated calcium for superior mobility in plants',zh_tag:'糖醇螯合钙，高效补钙，流动性强',en_ingr:'Sugar-alcohol chelated calcium',zh_ingr:'糖醇螯合钙',en_bene:'Sugar-alcohol chelated form ensures fast penetration and high mobility within the plant. Effectively prevents calcium deficiency symptoms: tip burn, cracking, blossom end rot. Improves fruit quality and shelf life.',zh_bene:'糖醇螯合态钙在植物体内具有更高的移动性和吸收利用率。有效预防缺钙症状：叶缘焦枯、裂果、脐腐等。改善果实品质和货架期。',en_meth:[['Foliar','Dilute 1000-1500x, from young fruit stage, every 10-15 days'],['Drip/Flood','Apply with irrigation during fruit development']],zh_meth:[['叶面喷施','稀释1000-1500倍，幼果期开始，每10-15天一次'],['冲施/滴灌','果实发育期随水施用']],en_prec:'Do not mix with phosphate fertilizers. Seal after use.',zh_prec:'不可与磷酸盐肥料混用。开封后密封储存。'},
{id:'LV046',code:'LV046',pkg:'5 kg',cat:'MicroElements',tag:'micro',en_name:'Granular Boron',zh_name:'颗粒硼',en_tag:'Slow-release boron granules for base and top dressing',zh_tag:'缓释硼颗粒，底肥追肥均可',en_ingr:'Boron (B) granular form, slow-release',zh_ingr:'硼（B）颗粒型，缓释',en_bene:'Granular slow-release boron for long-lasting supply. Suitable as base dressing or top dressing. Prevents boron deficiency: hollow stem, flower drop, poor fruit set.',zh_bene:'颗粒型缓释硼肥，持效期长。可作底肥或追肥使用。预防缺硼：空心茎、落花、坐果差等症状。',en_meth:[['Base dressing',kga(0.5,1)+' mixed into soil before planting'],['Top dressing',kga(0.3,0.5)+' applied around root zone']],zh_meth:[['底肥',kgaz(0.5,1)+'与土壤混合，在种植前施用'],['追肥',kgaz(0.3,0.5)+'施于根区周围']],en_prec:'Do not apply in excess -- boron toxicity can harm crops. Keep away from seeds.',zh_prec:'不要过量施用，硼过量会对作物造成伤害。避免与种子直接接触。'},
{id:'LV047',code:'LV047',pkg:'5 kg',cat:'MicroElements',tag:'micro',en_name:'Granular Zinc',zh_name:'颗粒锌',en_tag:'Slow-release zinc granules, promotes growth and disease resistance',zh_tag:'缓释锌颗粒，促进生长，提高抗性',en_ingr:'Zinc (Zn) granular form, slow-release',zh_ingr:'锌（Zn）颗粒型，缓释',en_bene:'Granular slow-release zinc for sustained supply. Zinc promotes auxin synthesis and cell division. Prevents zinc deficiency: little leaf, short internodes, mottled leaves.',zh_bene:'颗粒型缓释锌肥，持效期长。锌能促进生长素合成和细胞分裂。预防缺锌：小叶病、节间缩短、叶片花斑。改善果实品质和作物抗性。',en_meth:[['Base dressing',kga(1,2)+' mixed into soil before planting'],['Top dressing',kga(0.5,1)+' applied around root zone']],zh_meth:[['底肥',kgaz(1,2)+'与土壤混合，在种植前施用'],['追肥',kgaz(0.5,1)+'施于根区周围']],en_prec:'Avoid direct contact with seeds. Do not mix with phosphate fertilizers.',zh_prec:'避免与种子直接接触。不可与磷酸盐肥料混用。'},
{id:'LV064',code:'LV064',pkg:'20 kg',cat:'MicroElements',tag:'micro',en_name:'Artemis Calcium-Magnesium-Silicon',zh_name:'阿蒂米斯 钙镁硅',en_tag:'Soil improvement, reduce acidity and salinity, promote rooting',zh_tag:'改良土壤，调酸降盐，防裂增重，促进生根',en_ingr:'CaO 25%+, Si 2%+, MgO 16%+, Soil restoration factor 0.1%+, pH 7-9',zh_ingr:'氧化钙25%+，硅2%+，氧化镁16%+，土壤修复因子0.1%+，PH值：7-9；富含铁、锌、硼、钼等微量元素',en_bene:'Improves acidified, salinized and compacted soils. Decomposes fertilizer and pesticide residues, deactivates heavy metals. Increases yield, improves quality, reduces flower and fruit drop. Enhances disease and stress resistance.',zh_bene:'改善土质，酸化、盐化、板结、施肥过度，使土壤恢复活力。分解土壤、植株体内肥料、农药残留，钝化重金属污染。提高作物产量，改善品质，减少落花落果，提高结实率。增强抗病、抗菌、抗逆能力。',en_meth:[['Base dressing',kga(20,50)+' for vegetables/field crops'],['Top dressing','1-2 bags/acre at key growth stages'],['Drip/Flood','1 bag/acre with irrigation water']],zh_meth:[['底肥',kgaz(20,50)+'蔬菜及大田作物'],['追肥','在果树蔬菜其他作物生长关键期，每亩每次1-2袋'],['冲肥','随水冲施，每亩每次1袋']],en_prec:'Do not apply through sprayers, drip irrigation or similar equipment. This is a mineral soil amendment for base/broadcast application only.',zh_prec:'不可用于喷雾器、滴灌等设备，本品为矿源土壤改良剂，仅用于底肥撒施。'},
{id:'LV007',code:'LV007',pkg:'20 kg',cat:'Functional',tag:'func',en_name:'Potassium Fulvate 50+',zh_name:'矿源黄腐酸钾 50+',en_tag:'Soil improvement and plant nutrition',zh_tag:'土壤改良和植物营养产品',en_ingr:'Mineral fulvic acid 50%+, Humic acid 60%+, K2O 12%+, pH 8-11',zh_ingr:'矿源黄腐酸50%+，腐植酸60%+，氧化钾12%+，pH值：8-11',en_bene:'Promotes soil aggregate structure formation. Contains organic active substances to stimulate root growth. Forms chelates with N, P, K fertilizers to improve fertilizer utilization.',zh_bene:'黄腐酸能促进土壤团粒结构形成，增强土壤通透性，减少土壤板结。含有多种有机活性物质，刺激根系生长，增强植物对水分和养分的吸收能力。与氮、磷、钾等肥料形成络合体，提高肥料利用率。',en_meth:[['Foliar','Dilute 3000-5000x'],['Root drench','Dilute 2000-3000x, ensure thorough root penetration']],zh_meth:[['喷雾','按照稀释3000-5000倍液喷雾'],['淋根','建议2000-3000倍液，确保淋透根系']],en_prec:'Dilute completely in water before mixing with other products. Turns brown when diluted.',zh_prec:'使用时先将本品完全溶于水后再与其他产品混合。本品稀释后呈棕褐色，果实颜色浅的作物请尽量花前及果前喷施。'},
{id:'LV015',code:'LV015',pkg:'20 kg',cat:'Functional',tag:'func',en_name:'30% Amino Acid Powder',zh_name:'30%氨基酸原粉',en_tag:'Rich nutrition, soil improvement, growth regulation',zh_tag:'营养丰富，改良土壤，调节生长，提高肥效',en_ingr:'Free amino acids 30%+',zh_ingr:'游离氨基酸含量30%+',en_bene:'Promotes soil microbial activity and improves soil structure. Acts as metabolic regulator under stress conditions. Improves crop nutrient absorption, especially nitrogen, phosphorus and potassium.',zh_bene:'氨基酸对促进土壤微生物活性有好处，可能改善土壤理化性质。氨基酸还可以作为植物对逆境的代谢调节物质，提高抗逆性。有助于提高作物对养分（尤其是氮素、磷、钾等）的吸收效率。',en_meth:[['Foliar','Dilute 1000-2000x'],['Drip/Flood',kga(2,10)]],zh_meth:[['叶面喷雾','稀释1000-2000倍'],['冲施/滴灌',kgaz(2,10)]],en_prec:'Do not mix with strong acid, alkali or copper/calcium-containing pesticides. Seal after opening.',zh_prec:'不可与强酸、强碱或含铜/钙农药混配。开封后密封储存。'},
{id:'LV017',code:'LV017',pkg:'1 L',cat:'Functional',tag:'func',en_name:'Kelpkala Seaweed Extract',zh_name:'陇卡拉海藻精',en_tag:'Promotes rooting, improves resistance, promotes flowering',zh_tag:'促进生根，提高抗性，促开花结果',en_ingr:'Organic matter 50g/L+',zh_ingr:'有机质50g/L+',en_bene:'Promotes soil aggregate structure. Enhances photosynthesis and chlorophyll content. Promotes flowering and fruiting, increases fruit sugar content. Improves stress resistance.',zh_bene:'促进土壤团粒结构形成，改善土壤内部孔隙空间。增强光合作用，增加植物叶绿素含量。促进开花和结果，增加果实糖分，促进转色，改善风味。提高对不良环境条件（干旱、低温、盐碱等）的抗性。',en_meth:[['Foliar','Dilute 500-1000x'],['Drip/Flood',la(0.5,2)]],zh_meth:[['喷施','500-1000倍'],['冲施/滴灌',laz(0.5,2)]],en_prec:'Colour may vary by season; settling or separation during storage is normal -- shake well before use, does not affect performance. Avoid high temperature and direct sunlight; use promptly after opening to preserve quality. Do not mix with strong acid or alkaline pesticides. Rinse any skin contact with clean water.',zh_prec:'产品受季节影响会出现色度差异，贮存中可能出现凝结或分层，摇匀后不影响产品效果。避免高温暴晒，开封后及时使用，以免影响品质。忌与强酸强碱性农药混合使用。使用过程中若人畜皮肤直接溅到本品，用清水冲洗即可。'},
{id:'LV018',code:'LV018',pkg:'5 kg',cat:'Functional',tag:'func',en_name:'Enzymatic Fish Protein',zh_name:'酶解鱼蛋白',en_tag:'Natural fish protein source, safe and eco-friendly',zh_tag:'天然鱼蛋白来源，安全环保，不伤根',en_ingr:'Organic matter 450g/L+, Amino acids 350g/L+',zh_ingr:'有机质450g/L+，氨基酸350g/L+',en_bene:'Small-molecule amino acids directly absorbed by roots to promote root tip differentiation. Rich natural growth factors aid flower bud differentiation and fruit set.',zh_bene:'小分子氨基酸与鱼蛋白能直接被根系吸收，促进根尖分化与新根萌发。富含天然生长因子，有助花芽分化、提高坐果率，减少落花落果。',en_meth:[['Foliar','Dilute 800-1000x'],['Drip/Flood',la(1,2)+', every 15 days']],zh_meth:[['叶面喷施','稀释800-1000倍'],['冲施/滴灌',laz(1,2)+'，每隔15天一次']],en_prec:'Settling or separation during storage is caused by protein molecular weight differences -- shake well, does not affect performance. Avoid high temperature and direct sunlight; use promptly after opening. Do not mix with strong acid or alkaline pesticides. Rinse any skin contact with clean water.',zh_prec:'贮存中若出现凝结或分层，为蛋白质分子量大小区分造成，摇匀后不影响使用和效果。避免高温暴晒，开封后及时使用，以免影响品质。忌与强酸强碱性农药混合使用。使用过程中若人畜皮肤直接溅到本品，用清水冲洗即可。'},
{id:'LV019',code:'LV019',pkg:'1 L',cat:'Functional',tag:'func',en_name:'Potassium Phosphonate',zh_name:'亚磷酸钾',en_tag:'Promote shoot maturity, stimulate flowering and fruiting',zh_tag:'促新梢老熟，促花促果，膨果上色，提高抗性',en_ingr:'Total nutrients (P2O5+K2O) 860g/L+, P2O5 520g/L, K2O 340g/L',zh_ingr:'总养分含量（以P2O5+K2O计）860g/L+，P2O5=520g/L，K2O=340g/L',en_bene:'Suppresses and prevents fungal diseases: downy mildew, blight, root rot, fusarium wilt. Improves plant constitution and stress tolerance. Has rooting-agent-like function.',zh_bene:'对多种真菌性病害（如霜霉病、疫病、根腐病、枯萎病）有一定的抑制和预防作用。提高植物的抗逆性，改善营养运输系统。亚磷酸钾中的H3PO3具有类似生根剂的功能，能刺激根系生长和分枝。',en_meth:[['Vegetables','Dilute 800-1000x'],['Fruit trees','Dilute 1000-1200x'],['Shoot control','Dilute 200-300x'],['Drip/Flood',la(1,2)+' per application, max 2x per season']],zh_meth:[['蔬菜','800-1000倍液'],['果树','1000-1200倍液'],['控梢','稀释200-300倍喷雾'],['冲施/滴灌','每次'+laz(1,2)+'，整个生长季不高于2次']],en_prec:'Do not spray in direct sunlight; best applied before 10 am or after 4 pm. Do not mix with undiluted pesticide concentrate or alkaline pesticides; consult local agronomist for specific combinations. Avoid application during extreme drought, heavy rain or frost. Store in ventilated dry place away from children and animals. Some crystal formation is normal and does not affect performance.',zh_prec:'喷施不宜在阳光直射下进行，宜在上午10时前或下午4时后进行。避免与农药原液和碱性农药混用，具体混用方法咨询当地推广师。避免在极度干旱、大雨或霜冻时使用。贮存在通风干燥处、儿童和牲畜接触不到的地方。有少量结晶析出为正常，不影响正常使用。'},
{id:'LV020',code:'LV020',pkg:'1 L',cat:'Functional',tag:'func',en_name:'Leaf Power (Ye Dong Li)',zh_name:'叶动力',en_tag:'Promote rooting, greener leaves, promote flowering and fruiting',zh_tag:'促根壮苗，叶绿叶健，促花促果，膨果提质',en_ingr:'Free amino acids 100g/L+, Organic matter 150g/L+',zh_ingr:'游离氨基酸100g/L+，有机质150g/L+',en_bene:'Natural small-molecule amino acids directly participate in chlorophyll synthesis for greener, thicker leaves. Promotes carbohydrate accumulation to increase yield and quality. Effectively improves yellowing and early senescence.',zh_bene:'含天然小分子氨基酸，能直接参与叶绿素合成，增强光合作用。使用后叶片更厚、更亮、更有活力。促进碳水化合物积累，提高作物产量与品质。对缺素、黄化、早衰等症状有明显改善作用。',en_meth:[['Foliar','Dilute 500-800x'],['Drip/Flood',la(1,2)+' per application']],zh_meth:[['叶面喷施','稀释500-800倍'],['冲施/滴灌',laz(1,2)+'每次']],en_prec:'Shake well before use. Do not mix with strong acid, strong alkali, or copper/calcium-containing fertilisers. Best applied in the morning or evening; avoid high-temperature periods. Re-apply if rain occurs within 6 hours of application. Avoid high concentrations on weak seedlings or tender leaves; stop use immediately if leaf curling or blackening appears. Store in cool dry place away from children and food; reseal after opening.',zh_prec:'使用前请充分摇匀。勿与强酸、强碱或含铜、钙的肥料混用。使用时选择早晨或傍晚，避免高温时段。叶面喷施施肥后6小时内若遇雨，应适当补喷。弱苗或嫩叶期避免高浓度使用；若叶片出现异常（卷叶、发黑等）应立即停用。存放在阴凉干燥处，远离儿童与食物，开封后尽快使用并密封，使用后及时洗手。'},
{id:'LV021',code:'LV021',pkg:'10 kg',cat:'Functional',tag:'func',en_name:'Peptide Seaweed Extract',zh_name:'多肽海藻精',en_tag:'Improve soil, enhance stress resistance, promote rooting',zh_tag:'改善土壤，增强抗逆，促进根部',en_ingr:'Organic matter 25%+, N+P2O5+K2O 8%+, pH 5-7',zh_ingr:'有机质25%+，N+P2O5+K2O8%+，pH：5-7',en_bene:'Peptide molecules easily absorbed by plants to promote root and shoot growth. Seaweed extract contains natural plant hormones (gibberellin, cytokinin). Promotes soil aggregate structure. Improves nutrient absorption.',zh_bene:'多肽分子易被植物吸收，能调节植物细胞分裂和伸长，促进根系和茎叶生长。海藻提取物富含天然植物激素，激活植物生长代谢。海藻精可促进土壤团粒结构形成，使土壤更加疏松，提升保水保肥能力。',en_meth:[['Foliar','Dilute 1000-2000x, every 15-20 days'],['Drip/Flood','Dilute 500-800x, '+ga(300,1000)+' per acre']],zh_meth:[['叶面喷施','稀释1000-2000倍，间隔15-20天/次'],['冲施/滴灌','稀释500-800倍，每亩用量300-1000克']],en_prec:'Best applied in the morning or evening when weather is clear; re-apply once if rain occurs within 4 hours. Store sealed in cool dry place. Can be mixed with most pesticides or fertilisers; conduct a small-batch compatibility test before large-scale use.',zh_prec:'最佳使用时间为早晚天气良好时，喷洒要均匀，如喷后4小时内遇雨应补喷一次。保存于阴凉干燥处，密封保存。本品可以与大部分农药或肥料混用，混用前最好做少量混配实验再大面积应用。'},
{id:'LV025',code:'LV025',pkg:'20 kg',cat:'Functional',tag:'func',en_name:'Dou Huang Jin (Soybean Gold)',zh_name:'豆黄金',en_tag:'Promote rooting, soil improvement, improve quality and nutrition',zh_tag:'促根壮苗，改良土壤，提升品质，补充营养',en_ingr:'Protein 40%+, N+P+K 20%+, Total amino acids 30%+, Organic matter 40%+',zh_ingr:'蛋白质含量40%+，氮磷钾20%+，氨基酸总量30%+，有机质40%+',en_bene:'Promotes flower differentiation and reduces flower/pod drop. Enhances photosynthesis for thick green leaves. Accelerates grain filling, increases grain weight and protein content.',zh_bene:'含有调节型促花因子和营养补充剂，有效促进花芽分化。改善授粉条件，提高坐荚率，减少空荚、畸形荚、落荚现象。叶片浓绿厚实，提升光合效率。增强营养运输，提高籽粒蛋白含量、油脂积累、粒重。',en_meth:[['Base dressing',kga(20,50)+' with standard NPK compound fertilizer'],['Top dressing',kga(5,20)+' by drip/flood during any growth stage'],['Foliar','Dilute 500x, spray both leaf surfaces']],zh_meth:[['底肥',kgaz(20,50)+'，配合常规氮磷钾复合肥一起撒施、穴施'],['追肥',kgaz(5,20)+'，在作物的各个时期冲施或滴灌、喷淋均可'],['喷施','按500倍稀释后均匀喷施于叶片正反面']],en_prec:'Product absorbs moisture easily -- if a bag is not fully used, seal it tightly to prevent moisture uptake. May cake over time, does not affect performance. Full-formula nutrition; combine with NPK fertilisers for better results. Multiple consecutive applications improve overall efficacy.',zh_prec:'本品极容易吸潮，一袋未用完一定要将袋子扎紧密封以免吸潮。本品长时间放置会有结块现象，但不影响效果。本品营养全面，搭配氮磷钾肥料效果更好，连续多次使用效果更佳。'},
{id:'LV029',code:'LV029',pkg:'1 L',cat:'Functional',tag:'func',en_name:'Long Jian (Immune Activator)',zh_name:'陇健',en_tag:'Prevent virus disease, anti-cold, activate immunity, repel nematodes',zh_tag:'防止病毒病，抗寒抗冻，激活免疫，趋避线虫',en_ingr:'Chitosan oligosaccharide 50g/L+, Small peptides 150g/L+, Free amino acids 100g/L+, B+Zn 20g/L+',zh_ingr:'壳寡糖50g/L+，小肽150g/L+，游离氨基酸100g/L+，B+Zn20g/L+',en_bene:'Strong root promotion -- roots become whiter, thicker and longer after use. Enhances crop resistance to cold, drought and plant death. Contains humic acid and organic carbon to improve compacted soils.',zh_bene:'强力生根，扎根快、毛细根多，使用后根系更白、更粗、更长，吸收力强。增强作物抗性，抗低温、抗高温、抗病害、抗除草剂药害等，减缓死苗烂根、僵苗现象。含有腐植酸、有机碳源等改土成分，可改善土壤板结，活化土壤中有益菌群。',en_meth:[['Foliar','Dilute 500-1000x, during seedling, growth and fruit enlargement stages'],['Drip/Flood',la(1,2)+' per acre']],zh_meth:[['叶面喷施','在作物苗期、生长期、果实膨大期稀释500-1000倍喷施'],['冲施/滴灌','推荐'+laz(1,2)+'每亩']],en_prec:'Do not mix with strong acid or alkaline pesticides.',zh_prec:'忌与强酸强碱性农药混合使用。避免过量使用。'},
{id:'LV051',code:'LV051',pkg:'5 kg',cat:'Functional',tag:'func',en_name:'Seaweed Fish Protein',zh_name:'海藻鱼蛋白',en_tag:'Root growth, fruit enlargement, flowering, improved yield',zh_tag:'生根膨果，促花促果，提高抗性，提质增产',en_ingr:'Organic matter 50g/L+, pH 6-8',zh_ingr:'有机质50g/L+，pH：6-8',en_bene:'Combines seaweed and fish protein functions: nutrition, growth stimulation, stress resistance, root promotion and quality improvement.',zh_bene:'同时发挥海藻和鱼蛋白各自的功能，涵盖营养补给、生长刺激、抗逆增强、根系促进、品质改善等多个层面。',en_meth:[['Foliar','Dilute 300x'],['Root drench','200g per fruit tree']],zh_meth:[['叶喷','稀释300倍'],['淋根','200克一棵树']],en_prec:'Settling or separation during storage is normal -- shake well before use, does not affect performance. Avoid high temperature and direct sunlight; use promptly after opening. Do not mix with strong acid or alkaline pesticides. Rinse any skin contact with clean water.',zh_prec:'贮存中若出现凝结或分层，摇匀后不影响使用和效果。避免高温暴晒，开封后及时使用，以免影响品质。忌与强酸强碱性农药混合使用。使用过程中若人畜皮肤直接溅到本品，用清水冲洗即可。'},
{id:'LV053',code:'LV053',pkg:'1 kg',cat:'Functional',tag:'func',en_name:'Glucose Titanium',zh_name:'葡萄糖钛',en_tag:'Better color, taste and yield with titanium chelate',zh_tag:'颜色好，口感好，增产量，提高抗性',en_ingr:'Viable bacteria 200 million/g+, Ti 2%+, Glycine 5%+',zh_ingr:'有效活菌数2亿/g+，钛2%+，甘氨酸5%+',en_bene:'Promotes photosynthesis and enhances plant vigor, accelerates coloring and improves quality. Enhances stress resistance. Glucose-chelated titanium for superior absorption.',zh_bene:'有利于植株快速生长，增强上色、提质提量。有助于激发作物内源保护机制，提高抗冻性、抗干热风、抗病能力。葡萄糖螯合技术使钛更易被植物叶面和根系吸收，吸收效率高于无机钛。',en_meth:[['Foliar','Dilute 300-500x, every 7 days; use before flowering, young fruit, enlargement and pre-coloring'],['Drip/Flood',kga(2,5)]],zh_meth:[['叶面喷施','稀释300-500倍，间隔期为7天；可在花前期、幼果期、膨大期、著色前期喷施'],['滴灌/喷施',kgaz(2,5)]],en_prec:'Store in cool dry place away from children and pets; avoid direct sunlight. Can be mixed with fungicides and insecticides; do not mix with alkaline pesticides.',zh_prec:'本品宜在阴凉干燥处保存，避免阳光直射，远离儿童和宠物。本品可以与其他杀菌剂、杀虫剂等农药混配使用，碱性农药除外。'},
{id:'LV055',code:'LV055',pkg:'1 L',cat:'Functional',tag:'func',en_name:'Kara Lu Magic Water',zh_name:'卡拉露神仙水',en_tag:'Revive seedlings, greener leaves, rapid recovery',zh_tag:'提苗绿叶，提高抗性，快速修复',en_ingr:'Soluble protein, soluble sugar, amino acids, biotin and other nutrients',zh_ingr:'可溶性蛋白，可溶性糖，氨基酸，生物素等营养物质',en_bene:'Quickly replenishes nutrients and promotes photosynthesis. Effective for weak, small, yellow or stunted seedlings. Induces stress resistance proteins. Promotes root growth after seedling stress.',zh_bene:'快速补充营养，促进光合作用。对小苗、弱苗、黄叶、枯叶、僵苗等使用效果比较好。诱导植物产生抗性，提高植物抗寒、抗旱、抗盐碱、抗高温、抗洪涝等能力。促进根系的生长，特别是苗期因为烤苗蒸苗问题导致根系不好，使用效果比较好。',en_meth:[['Foliar','Dilute 500x, use during weak seedling / yellowing stages'],['Root drench','Dilute 300x']],zh_meth:[['叶面喷施','稀释500倍，在作物弱苗、僵苗、黄苗期使用'],['淋根','稀释300倍']],en_prec:'Spray uniformly; do not spray in direct sunlight. Can be mixed with fungicides and insecticides; do not mix with strong alkaline substances. Not recommended for use during vigorous growth stage or colour-change stage.',zh_prec:'使用时应均匀喷雾，请勿在阳光下喷雾。可与杀菌剂、杀虫剂混配，但不能跟强碱性物质混配。旺长期和转色期不建议使用。'},
{id:'LV065',code:'LV065',pkg:'1 kg',cat:'Functional',tag:'func',en_name:'Potassium Fulvate (Small Pack)',zh_name:'矿源黄腐酸钾（小包装）',en_tag:'Promote rooting, improve soil, regulate pH, boost fertilizer efficacy',zh_tag:'促根壮苗，改土固氮，调节酸碱，提高肥效',en_ingr:'Mineral fulvic acid 50%+, K2O 12%+, pH 6-8',zh_ingr:'矿源黄腐酸50%+，氧化钾12%+，pH：6-8',en_bene:'Improves soil structure and enhances soil activity. Increases nutrient utilization rate and promotes nutrient absorption. Lower pH (6-8) makes it suitable for slightly acidic soils.',zh_bene:'改良土壤结构，增强土壤活性。提高养分利用率，促进养分吸收。刺激作物生长，促进根系发育，提高抗性。pH 6-8（比20KG包装的pH 8-11更低），更适合偏酸性土壤。',en_meth:[['Foliar','Dilute 3000-5000x'],['Root drench','Dilute 2000-3000x, ensure thorough root penetration']],zh_meth:[['叶面喷施','稀释3000-5000倍，因作物不同，使用量可做适当调整'],['淋根','建议稀释2000-3000倍液，确保淋透根系']],en_prec:'Adjust usage rate based on soil type, climate and target yield. For best results, apply at least 2 times for vegetables and at least 3 times for fruit trees per growing season. Dissolve completely in water before mixing with other products. Product turns brown when diluted -- normal. For light-coloured fruit crops, apply before flowering and fruiting; switch to soil drench or drip irrigation in later stages.',zh_prec:'用量用法供参考，根据土壤、气候、目标产量等不同可以酌情增减。为了保证效果，建议蔬菜类生长期不低于2次，果树类不低于3次。使用时先将本品完全溶于水后再与其他产品混合。本品稀释后呈棕褐色。果实颜色浅的作物请尽量花前及果前喷施，后期建议冲施或滴灌。'},
{id:'LV066',code:'LV066',pkg:'1 kg',cat:'Functional',tag:'func',en_name:'80% Amino Acid Powder',zh_name:'80%氨基酸原粉',en_tag:'Improve soil, promote growth, root development, green seedlings',zh_tag:'改土促长，提升口感，促进作物根系发达，叶绿苗健',en_ingr:'Viable bacteria 2 billion/g+ (fermentation-derived)',zh_ingr:'有效活菌数20亿/g+（发酵工艺）',en_bene:'Rich in plant-source amino acids (fermentation process) for fast absorption. Promotes root development, healthy seedlings and flower differentiation. Provides carbon and nitrogen nutrition to soil microbes to improve soil.',zh_bene:'富含多种植物源氨基酸，采用发酵工艺，吸收速度快，快速补充作物营养。促进根系发达，扶苗健苗，叶绿叶健，促进花芽分化，果实发育健康。为土壤微生物提供碳氮营养，刺激微生物活跃，起到改良土壤的作用。同时提高作物抗盐、抗旱、抗寒等抗逆性。',en_meth:[['Foliar','Dilute 1000-1500x, spray evenly on leaves'],['Drip/Flood',kga(1,2)+' per acre']],zh_meth:[['喷施','兑水稀释1000-1500倍均匀喷施于叶片'],['冲施/滴灌',kgaz(1,2)+'每亩']],en_prec:'During transport, protect from rain and direct sunlight; at temperatures below 0°C, take precautions to preserve product quality; handle with care to avoid packaging damage. Do not mix with products harmful to microbial agents or with fungicides/antibiotics. Store in a cool, dry, ventilated warehouse; do not store outdoors.',zh_prec:'运输过程中有遮盖物，防止雨淋、日晒及高温；气温低于0°C时采取适当措施以保证产品质量；轻装轻卸，避免包装破损。严禁与对微生物菌剂有毒、有害的其他物品混装；不能与杀菌剂、抗菌类混合施用。产品应贮存在阴凉、干燥、通风的库房内，不得露天堆放，以防日晒雨淋。'},
{id:'LV005',code:'LV005',pkg:'1 kg',cat:'Microbial',tag:'bio',en_name:'Bacillus Subtilis',zh_name:'枯草芽孢杆菌',en_tag:'Reduce root rot, nourish soil, promote rooting and seedling vigor',zh_tag:'减少死棵烂根，养护土壤，生根壮苗，提高肥效',en_ingr:'Viable bacteria count 100 billion/g+ (FRAC BM02)',zh_ingr:'有效活菌数1000亿/g+（FRAC BM02）',en_bene:'Improves soil structure, decomposes organic matter. Secretes IAA and gibberellin to promote root growth. Suppresses soil-borne diseases: fusarium wilt, anthracnose, root rot.',zh_bene:'能分解有机质，促进有机质转化，改善土壤通透性，减少板结。分泌吲哚乙酸（IAA）、赤霉素（GA）等，促进植物根系生长。可抑制土传病害，如枯萎病、炭疽病、根腐病。',en_meth:[['Spray','Dilute 300x, every 5-7 days at early disease onset'],['Root drench',ga(500,1000)+', dilute 800-1000x']],zh_meth:[['喷雾','兑水300倍，对叶面及根茎部喷施，每隔5-7天喷雾一次'],['灌根/冲施',gaz(500,1000)+'，稀释800-1000倍']],en_prec:'Do not mix with fungicides or antibiotics. Keep soil moist during application.',zh_prec:'不能与杀菌剂、抗菌类混合施用。施用本产品需要保持土壤湿润。'},
{id:'LV006',code:'LV006',pkg:'1 kg',cat:'Microbial',tag:'bio',en_name:'Trichoderma Harzianum',zh_name:'哈茨木霉菌',en_tag:'Reduce root rot, activate soil, promote rooting',zh_tag:'减少死棵烂根，活化土壤，促进生根，提高肥效',en_ingr:'Viable bacteria count 1000 billion/g+ (FRAC BM02)',zh_ingr:'有效活菌数1000亿/g+（FRAC BM02）',en_bene:'Suppresses fusarium, anthracnose, damping-off disease. Decomposes soil organic matter. Secretes IAA to promote root development and crop stress resistance.',zh_bene:'有效抑制多种植物病原真菌，如枯萎病、炭疽病、立枯病、猝倒病。分解土壤有机质，改善土壤团粒结构。分泌植物生长激素（如IAA）促进作物根系发育，提高抗逆性。',en_meth:[['Spray','Dilute 300x, every 5-7 days'],['Root/Flood',ga(500,1000)+', dilute 800-1000x']],zh_meth:[['喷雾','兑水300倍，每隔5-7天喷雾一次'],['灌根/冲施',gaz(500,1000)+'，稀释800-1000倍']],en_prec:'Cannot be mixed with fungicides or antibiotics. Keep soil moist. White mycelium growth after use is normal.',zh_prec:'本品不能与杀菌剂、抗菌素混合使用。保持土壤潮湿，效果更佳。用本品后会长出白色菌丝，为正常现象。'},
{id:'LV024',code:'LV024',pkg:'1 kg',cat:'Microbial',tag:'bio',en_name:'Defense 100-Billion Bacteria',zh_name:'防线百亿菌',en_tag:'Improve soil, suppress disease, activate soil microecology',zh_tag:'改土促根，抗病抑菌，提高肥效，激活土壤微生态',en_ingr:'Viable bacteria count 10 billion+ (FRAC BM02)',zh_ingr:'有效活菌数100亿+（FRAC BM02）',en_bene:'Suppresses damping-off, root rot, fusarium wilt, bacterial wilt. Enhances crop resistance to drought, low/high temperature and heavy metals.',zh_bene:'有效抑制立枯病、根腐病、枯黄萎病、青枯病、猝倒病等土传病害。增强作物对干旱、低温、高温、药害、重茬等不良环境的适应能力。',en_meth:[['Drip/Flood',ga(500,1000)+' -- seedling, post-transplant, re-greening'],['Broadcast',kga(5,10)+' broadcast before sowing'],['Root dip','1:200-500x dilution before transplanting']],zh_meth:[['冲施/滴灌',gaz(500,1000)+'（苗期、定植后、返青期）'],['拌肥/撒施',kgaz(5,10)+'混拌撒施（播种或整地前）'],['蘸根','1:200-500倍液浸蘸（定植前）']],en_prec:'Recommend applying together with organic fertiliser for enhanced efficacy. Cannot be mixed with chemical fungicides such as carbendazim (多菌灵), metalaxyl (杀毒矾) or streptomycin (链霉素). Best applied in the morning or evening; keep product away from direct sunlight.',zh_prec:'推荐增施有机肥，本菌剂使用时充分与有机肥混合施用，可增强防效。本品不能与化学杀菌剂混合施用，如多菌灵、杀毒矾、链霉素等。最佳使用时间为早上或傍晚，勿使菌剂直接放置于强阳光下。'},
{id:'LV043',code:'LV043',pkg:'1 L',cat:'Microbial',tag:'bio',en_name:'Fermentation Treasure (EM)',zh_name:'腐熟宝',en_tag:'Decompose organic matter, improve soil ecology',zh_tag:'分解有机质，改善土壤生态',en_ingr:'Composite microbial fermentation agent (FRAC BM02)',zh_ingr:'复合微生物发酵菌剂（FRAC BM02）',en_bene:'Accelerates decomposition of organic matter and crop residues. Improves soil structure and microbial diversity. Reduces harmful gases from undecomposed organics. Promotes nutrient cycling and availability.',zh_bene:'加速有机质和作物残茬的分解。改善土壤结构和微生物多样性。减少未腐熟有机物产生的有害气体。促进养分循环和有效性。',en_meth:[['Drip/Flood',la(0.5,1)+' per acre'],['Compost activation','Mix 1:100-200 with water and spray onto organic materials']],zh_meth:[['冲施/滴灌',laz(0.5,1)+'/英亩'],['堆肥激活','按1:100-200兑水后喷施于有机物料上']],en_prec:'Do not mix with strong fungicides or disinfectants.',zh_prec:'不能与强杀菌剂或消毒剂混用。储存于阴凉避光处。'},
{id:'LV044',code:'LV044',pkg:'1 L',cat:'Microbial',tag:'bio',en_name:'EM Original Solution',zh_name:'EM原液',en_tag:'Activate beneficial soil microbes, improve soil ecology',zh_tag:'激活土壤有益微生物，改善土壤微生态',en_ingr:'Effective microorganism composite solution (FRAC BM02)',zh_ingr:'有效微生物复合溶液（FRAC BM02）',en_bene:'Activates beneficial microbial communities in soil. Improves soil structure and promotes plant resistance. Suppresses harmful pathogens through competitive exclusion. Enhances nutrient cycling and fertilizer efficiency.',zh_bene:'激活土壤有益细菌群落。改善土壤结构，促进植物抗性。通过竞争排除抑制有害病原体。增强养分循环和肥效。',en_meth:[['Drip/Flood','Dilute 200-500x, '+la(0.2,0.5)+' per acre'],['Foliar','Dilute 500-1000x']],zh_meth:[['冲施/滴灌','稀释200-500倍，'+laz(0.2,0.5)+'/英亩'],['叶面','稀释500-1000倍']],en_prec:'Do not mix with chemical fungicides. Store sealed away from light.',zh_prec:'不能与化学杀菌剂混用。密封储存于避光处。'},
{id:'LV052',code:'LV052',pkg:'1 kg',cat:'Microbial',tag:'bio',en_name:'Penicillium Bilaiae',zh_name:'拜赖青霉',en_tag:'Prevent soil-borne problems, promote roots, activate phosphorus',zh_tag:'防止土传问题，促根壮苗，活化磷，防根结线虫',en_ingr:'Viable bacteria count 500 million/g+ (FRAC BM02)',zh_ingr:'有效活菌数5亿/g+（FRAC BM02）',en_bene:'Secretes organic acids to convert insoluble phosphorus into plant-available phosphorus. Improves soil microbial community. Suppresses root rot, fusarium wilt, damping-off.',zh_bene:'拜赖青霉可分泌有机酸将土壤中难溶态磷转化为可被作物直接吸收的有效磷。改善土壤团粒结构，激活土壤中有益微生物群落。可通过竞争空间、养分、分泌抑菌物质等方式，抑制根腐病、枯萎病、立枯病等病原菌。',en_meth:[['Drip/Flood','Dilute 300-500x, 1 kg/acre per application, 2-3x per season'],['Seedbed spray','Dilute 300x, spray onto seedling substrate'],['Mixed with fertilizer','Mix with organic or chemical fertilizer, apply immediately']],zh_meth:[['冲施/滴灌','稀释300-500倍随水滴灌或冲施，每次每英亩建议用约6公斤（整个生育期灌2-3次）'],['喷淋','兑水300倍，均匀喷洒到育苗基质或者苗床作物上，与适量化肥混用更佳'],['拌肥','做种肥或底肥时，可将本品与化肥或者有机肥拌在一起，随肥料一起施用。需随拌随用。']],en_prec:'Do not mix with fungicides or antibiotics. Mix immediately before use when combining with fertilizer.',zh_prec:'不能与杀菌剂、抗菌类混合施用。与肥料混拌时需随拌随用，以免造成肥料融化而影响播种质量。'},
{id:'LV054',code:'LV054',pkg:'1 kg',cat:'Microbial',tag:'bio',en_name:'Bacillus Velezensis',zh_name:'贝莱斯芽孢杆菌',en_tag:'Nourish soil, promote rooting, increase resistance, reduce plant death',zh_tag:'养护土壤，生根壮苗，提高抗性，减少死棵烂苗',en_ingr:'Viable bacteria count 20 billion/g+ (FRAC BM02)',zh_ingr:'有效活菌数200亿/g+（FRAC BM02）',en_bene:'Broad-spectrum disease suppression: anthracnose, white mold, root rot, scab. Promotes root activity, improves soil microecology. High adaptability: survives in pH 4-10 conditions.',zh_bene:'广谱抑病能力：多数菌株能够同时对多种真菌、细菌病原菌具有一定抑制作用，例如对炭疽病、白绢病、根腐病、赤霉病等有研究支持。不仅防病，还能增强根系活力、改善土壤微生态、促进作物生长。某些菌株在高盐、pH变动、逆境条件下仍能存活或维持活性（pH 4-10条件下仍能生长）。',en_meth:[['Drip/Flood','Dilute 300-500x, 1 kg/acre per application, 2-3x per season'],['Seedbed spray','Dilute 300x, spray onto seedling substrate'],['Mixed with fertilizer','Mix with organic or chemical fertilizer, apply immediately']],zh_meth:[['冲施/滴灌','稀释300-500倍，每次每英亩建议用约6公斤，整个生育期滴灌2-3次'],['喷淋','兑水300倍，均匀喷洒到育苗基质或者苗床作物上，与适量化肥混用更佳'],['拌肥','做种肥或底肥时，可将本品与化肥或者有机肥拌在一起，随肥料一起施用。需随拌随用。']],en_prec:'Living microbial product -- store at low temperature in a dry environment; do not expose to high heat or direct sunlight. Cannot be mixed with fungicides or antibiotics; however, it can be mixed with insecticides. Adjust dosage based on crop growth and density; dosage can be doubled if needed. Recommended to use in combination with humic acid potassium fertiliser for best results.',zh_prec:'本品为活体微生物，贮存时要放在低温干燥的环境中，请勿高温暴晒。不能与杀菌剂、抗菌素混合使用，但可与杀虫剂复配。根据作物长势及密度合理调整用量，可加倍使用，建议配合绿陇矿源黄腐酸钾，效果更佳。'},
{id:'LV032',code:'LV032',pkg:'1 kg',cat:'Fungicide',tag:'fung',en_name:'Difenoconazole + Pyraclostrobin',zh_name:'苯甲·吡唑酯',en_tag:'Block fungal invasion, broad-spectrum leaf disease control',zh_tag:'阻止病菌侵入，减少发病次数，防治叶部多种真菌病害',en_ingr:'Difenoconazole 15% (FRAC 3) + Pyraclostrobin 25% (FRAC 11)',zh_ingr:'苯醚甲环唑15%（FRAC 3）+ 吡唑醚菌酯25%（FRAC 11）',en_bene:'Strong systemic absorption and bidirectional conduction. Fast-acting: suppresses fungal spread within hours. Broad-spectrum: powdery mildew, rust, anthracnose, leaf spot, downy mildew.',zh_bene:'苯甲·吡唑酯具有优异的内吸性，可通过叶片迅速吸收并在体内上下移动。吡唑醚菌酯见效快，喷后数小时内即可抑制病菌扩展。可有效防治白粉病、锈病、炭疽病、叶斑病、霜霉病等多种病害。',en_meth:[['Grapes (powdery mildew)','Dilute 1500-2000x, safety interval 14 days, max 3x per season']],zh_meth:[['葡萄（白粉病）','1500-2000倍液（喷雾），安全间隔期14天，每季最多施药3次']],en_prec:'Rotate with fungicides of different mechanisms. Max 3 applications per season.',zh_prec:'必要时，可与其它不同作用机制的杀菌剂轮换使用。每季作物最多施药3次。'},
{id:'LV033',code:'LV033',pkg:'1 kg',cat:'Fungicide',tag:'fung',en_name:'Tebuconazole 430 g/L',zh_name:'戊唑醇 430g/L',en_tag:'Strong systemic absorption, broad-spectrum fungal control',zh_tag:'内吸性强，杀菌防病',en_ingr:'Tebuconazole 430g/L (FRAC 3)',zh_ingr:'戊唑醇430克/升（FRAC 3）',en_bene:'Effective against powdery mildew, rust, anthracnose, scab, leaf spot. Strong systemic absorption. Rain-resistant.',zh_bene:'对白粉病、锈病、炭疽病、赤霉病、叶斑病等多种真菌病害防效显著。具有强内吸性，药剂可迅速被植物吸收并向上传导，治疗和保护效果兼具。配方中添加助剂和增效剂，耐雨水冲刷性强。',en_meth:[['Rust',mla(15,20)+' (spray)'],['Powdery mildew',mla(15,18)+' (spray)']],zh_meth:[['锈病',mlaz(15,20)+'（喷雾）'],['白粉病',mlaz(15,18)+'（喷雾）']],en_prec:'Safety interval: apple 35 days, bitter gourd 5 days. Max 3x per season.',zh_prec:'本产品在苹果树上使用的安全间隔期为35天，每季最多使用次数为3次。在苦瓜作物上使用的安全间隔期为5天。大风天或预计1小时内降雨和采花期，请勿施药。'},
{id:'LV057',code:'LV057',pkg:'500 g',cat:'Fungicide',tag:'fung',en_name:'Metalaxyl-M + Hymexazol',zh_name:'精甲·噁霉灵',en_tag:'Broad-spectrum systemic fungicide for root disease',zh_tag:'杀菌广谱，内吸性好，防治根部病害',en_ingr:'Metalaxyl-M 5% (FRAC 4) + Hymexazol 25% (FRAC 32)',zh_ingr:'精甲霜灵5%（FRAC 4）+ 噁霉灵25%（FRAC 32）',en_bene:'Two components synergize to broaden disease control spectrum. Best for root and soil-borne disease control.',zh_bene:'两种成分各自对土传/根部真菌有抑制作用，复配可扩大防控谱系、增强杀菌效果。',en_meth:[['Fusarium wilt',mla(15,18)+' (spray)'],['Damping-off',mla(37.5,45)+' (spray)']],zh_meth:[['枯萎病',mlaz(15,18)+'（喷雾式）'],['猝倒病',mlaz(37.5,45)+'（喷雾式）']],en_prec:'Cannot be mixed with alkaline pesticides. Apply 2-3 times at 7-10 day intervals.',zh_prec:'不可与碱性农药等物质混用。连续喷雾2-3次，间隔7-10天施药1次。大风天或预计1小时内降雨，请勿施药。'},
{id:'LV058',code:'LV058',pkg:'500 g',cat:'Fungicide',tag:'fung',en_name:'Kasugamycin + Quinoline Copper',zh_name:'春雷·喹啉铜',en_tag:'Prevention and treatment, controls both fungi and bacteria',zh_tag:'预防治疗，内吸性好，防治真菌细菌',en_ingr:'Kasugamycin 3% (FRAC 24) + Quinoline copper 30% (FRAC M01)',zh_ingr:'春雷霉素3%（FRAC 24）+ 喹啉铜30%（FRAC M01）',en_bene:'Broad-spectrum: controls both bacterial and fungal diseases in one application. Lower phytotoxicity risk compared to traditional inorganic copper fungicides. Kasugamycin provides systemic activity; quinoline copper provides protective barrier.',zh_bene:'复配后既能控制细菌性病害，又兼顾真菌病害，减少需要单独用药的情况。相比传统无机铜杀菌剂，药害风险降低，安全性更高。春雷霉素能发挥内吸或系统性作用，而喹啉铜作为铜剂则起保护作用，对新发病斑进行防护。',en_meth:[['Cucumber (downy mildew)',mla(50,70)+' (spray)']],zh_meth:[['黄瓜（霜霉病）',mlaz(50,70)+'（喷雾式）']],en_prec:'Sensitive crops: soybean, lotus -- avoid spray drift. Safety interval on cucumber: 3 days. Max 3x per season.',zh_prec:'对大豆、莲花等敏感作物要避免飘移。在黄瓜上的安全间隔期为3天，每季最多使用次数为3次。'},
{id:'LV062',code:'LV062',pkg:'500 g',cat:'Fungicide',tag:'fung',en_name:'Fluopyram + Quinoline Copper',zh_name:'氟吡菌胺·喹啉铜',en_tag:'Targets both fungal and bacterial diseases',zh_tag:'针对真菌、细菌性病害',en_ingr:'Fluopyram 8% (FRAC 7) + Quinoline copper 24% (FRAC M01)',zh_ingr:'氟吡菌胺8%（FRAC 7）+ 喹啉铜24%（FRAC M01）',en_bene:'Strong systemic activity absorbed through roots and leaves. Quinoline copper forms durable protective film, rain-resistant. Dual action: fluopyram inhibits mitochondrial respiration of pathogens; quinoline copper forms protective barrier.',zh_bene:'氟吡菌胺可通过根系、叶片吸收并在植株内系统运输，对土传病害和茎叶病害均可防控。喹啉铜在叶面形成稳定保护膜，不易被雨水冲刷。氟吡菌胺内吸性强，抑制病原菌线粒体呼吸，对灰霉病、白粉病、根腐病、炭疽病等真菌病害防效显著。',en_meth:[['Vegetables','15 ml in 15 L water'],['Fruit trees','7.5-10 ml in 15 L water']],zh_meth:[['蔬菜','15毫升兑水15L'],['果树','7.5-10毫升兑水15L']],en_prec:'Sensitive crops: soybean, lotus. Safety interval on cucumber: 3 days. Max 3x per season.',zh_prec:'对大豆、莲花等敏感作物要注意。在黄瓜上的安全间隔期为3天，每季最多使用次数为3次。'},
{id:'LV063',code:'LV063',pkg:'500 g',cat:'Fungicide',tag:'fung',en_name:'Difenoconazole + Prochloraz',zh_name:'苯甲·咪鲜胺',en_tag:'Broad-spectrum, strong systemic absorption, protection and treatment',zh_tag:'杀菌广谱，内吸性好，保护治疗',en_ingr:'Prochloraz 15% (FRAC 3) + Difenoconazole 5% (FRAC 3)',zh_ingr:'咪鲜胺15%（FRAC 3）+ 苯醚甲环唑5%（FRAC 3）',en_bene:'Prochloraz disrupts ergosterol biosynthesis in fungal cell membranes, destroys cell membrane integrity. Strong protective action against fungi with some curative effect. Primarily targets anthracnose.',zh_bene:'咪鲜胺属于咪唑类杀菌剂，作用机制是干扰病原真菌细胞膜中麦角甾醇的生物合成，破坏细胞膜的完整性，从而抑制菌体生长或杀死菌体。对于真菌的保护性作用较强，但也具有一定的治疗作用。常见防治对象包括炭疽病。',en_meth:[['Spray','Dilute 1200-1700x; apply at disease onset or pre-infection stage']],zh_meth:[['喷雾','使用1200-1700倍液喷雾，在病害发生初期或预防期施药效果较好']],en_prec:'Apply at early onset of anthracnose; ensure uniform spray coverage. Do not spray in windy conditions or when rain is expected within 1 hour.',zh_prec:'本品应于炭疽病发生初期施药，注意喷雾均匀。大风天或预计1小时内降雨，请勿施药。'},
{id:'LV059',code:'LV059',pkg:'500 g',cat:'Insecticide',tag:'ins',en_name:'Bifenazate + Etoxazole',zh_name:'联肼·乙螨唑',en_tag:'Kills spider mites at all life stages',zh_tag:'速效+持效双重保障，消灭各虫态红蜘蛛',en_ingr:'Bifenazate 30% (IRAC 20D) + Etoxazole 15% (IRAC 10B)',zh_ingr:'联苯肼酯30%（IRAC 20D）+ 乙螨唑15%（IRAC 10B）',en_bene:'Fast-acting (bifenazate) + long-lasting (etoxazole) dual protection. Covers all mite life stages: eggs, nymphs, adults.',zh_bene:'联苯肼酯部分能较快起效，攻击成螨和若螨。乙螨唑部分可延长持效，对卵与幼螨阶段有较好的防控作用。复配后既可杀若螨/成螨，又可抑制卵代孵化，减少再次发生的概率。',en_meth:[['Red spider mites','Dilute 8000-12000x, 1 application per season, safety interval 14 days']],zh_meth:[['红蜘蛛','8000-12000倍液（喷雾式），每季最多使用1次，安全间隔期为14天']],en_prec:'Apply at early mite infestation. Spray both leaf surfaces. Max 1x per season.',zh_prec:'在柑橘红蜘蛛发生初期喷雾施药1次，均匀喷湿叶片正反面至湿润欲滴。大风天或预计1小时内有雨，请勿施药。'},
{id:'LV060',code:'LV060',pkg:'500 g',cat:'Insecticide',tag:'ins',en_name:'48% Thiamethoxam',zh_name:'48%噻虫胺',en_tag:'Neonicotinoid -- systemic, contact and stomach toxin',zh_tag:'新烟碱类杀虫剂，内吸触杀胃毒',en_ingr:'Thiamethoxam 48% (IRAC 4A)',zh_ingr:'噻虫胺48%（IRAC 4A）',en_bene:'High concentration for cost-effective pest control. Excellent systemic and conducting properties. Broad-spectrum against multiple pest types.',zh_bene:'较高含量意味着用量可能较低即可达到防治效果，对经济性有利。容易在植物体内传导，对隐藏或难以喷到部位的害虫也有防效。对多种类型的害虫有效，适应性较强。',en_meth:[['Rice (planthoppers)',mla(6,8)],['Chives (maggots)',mla(100,125)]],zh_meth:[['水稻（稻飞虱）',mlaz(6,8)],['韭菜（韭蛆）',mlaz(100,125)]],en_prec:'Do not spray in wind or before rain. Safety interval on rice: 14 days. Max 2x per season.',zh_prec:'大风天或预计1小时内降雨，请勿施药。在水稻上使用的间隔期为14天，每季施药次数不高于2次。'},
{id:'LV061',code:'LV061',pkg:'500 g',cat:'Insecticide',tag:'ins',en_name:'20% Bifenthrin + Thiamethoxam',zh_name:'20%联苯·噻虫胺',en_tag:'Fast knockdown and persistent protection',zh_tag:'防治效果好，内吸触杀胃毒',en_ingr:'Bifenthrin 5% (IRAC 3A) + Thiamethoxam 5% (IRAC 4A)',zh_ingr:'联苯菊酯5%（IRAC 3A）+ 噻虫胺5%（IRAC 4A）',en_bene:'Dual control: above-ground (aphids, thrips, whitefly) and below-ground pests (root maggots, cutworms, wireworms).',zh_bene:'复配剂型能够兼顾地上害虫（如蚜虫、蓟马、飞虱、叶蝉、菜青虫等）和地下害虫（如根蛆、蒜蛆、蛴螬、金针虫等）。联苯菊酯提供较快的触杀/胃毒作用，害虫中毒速度快。',en_meth:[['Wheat (aphids)',mla(15,25)+' (spray)']],zh_meth:[['小麦（蚜虫）',mlaz(15,25)+'（喷雾）']],en_prec:'Safety interval on cabbage: 21 days. Max 1x per season.',zh_prec:'本品在甘蓝上的安全间隔期为21天，每季最多使用次数为1次。大风天或预计1小时内降雨，请勿施药。'},
{id:'LV023',code:'LV023',pkg:'500 g',cat:'Regulator',tag:'reg',en_name:'Sodium Nitrophenolate',zh_name:'复硝酚钠',en_tag:'Break dormancy, activate cells, prevent fruit drop, improve yield',zh_tag:'打破休眠，提高细胞活力，改善品质，防止落花落果',en_ingr:'5-nitroguaiacolate 0.3%, p-nitrophenolate 0.9%, o-nitrophenolate 0.6% (Hormone: Auxin-like | MOA: Cell activator — promotes cytoplasm flow & cell division)',zh_ingr:'5-硝基邻甲氧基苯酚钠0.3%，对硝基苯酚钠0.9%，邻硝基苯酚钠0.6%（激素类型：类生长素 | 作用机制：激活细胞—促进原生质流动及细胞分裂）',en_bene:'Rapidly penetrates plant tissue to promote cytoplasm flow and improve metabolic activity. Stimulates root and shoot development. Breaks seed dormancy for improved germination.',zh_bene:'喷施后可迅速渗透至植物体内，促进细胞质（原生质体）流动，从而提高细胞内物质运输效率和代谢活性。能刺激植物根系和芽的发育，促进根系生长、分枝、提高植株生长势。对某些作物的种子休眠或萌发不良有缓解作用，可用于浸种/播前处理。',en_meth:[['Cotton (spray)','Dilute 2000-3000x'],['General use','Dilute 2000-3000x foliar spray during key growth stages']],zh_meth:[['棉花（喷雾）','2000-3000倍液'],['一般使用','2000-3000倍液，在作物关键生长时期叶面喷施']],en_prec:'Store away from heat sources. Do not store with food or feed.',zh_prec:'储存于阴凉处，远离热源。不要与食品和饲料混放。'},
{id:'LV028',code:'LV028',pkg:'1 L',cat:'Regulator',tag:'reg',en_name:'14-OH Brassinolide',zh_name:'14羟基芸苔素甾醇',en_tag:'Promotes cell division, enhances resistance, reverses pesticide damage',zh_tag:'促细胞生长分裂，促花芽分化，提高抗性，解药害肥害',en_ingr:'14-hydroxybrassinolide 0.0075% (Hormone: Brassinosteroid | MOA: Promotes cell division & elongation via BR signalling pathway)',zh_ingr:'14-羟基芸苔素甾醇0.0075%（激素类型：油菜素甾醇（BR）| 作用机制：通过油菜素甾醇信号通路促进细胞分裂和伸长）',en_bene:'Increases pollen activity and promotes pollen tube elongation. Visibly promotes root development. Significantly enhances cold, drought, heat, salt, disease and pesticide-damage resistance.',zh_bene:'增加花粉活力、促进花粉管伸长，提高授粉成功率，减少落花、落果，提高坐果率。明显促进根系发育，主根深、侧根多、毛细根丰富，增强作物吸肥吸水能力。显著提高作物抗寒、抗旱、抗热、抗盐、抗病、抗药害能力。',en_meth:[['Citrus / bok choy','Dilute 1250-2000x'],['Wheat / rice','Dilute 1000-3333x']],zh_meth:[['柑橘/小白菜','1250-2000倍液'],['小麦/水稻','1000-3333倍液']],en_prec:'Store in cool, dry, ventilated area away from heat sources and children.',zh_prec:'本品应储存在阴凉、干燥、通风、防雨处，不可倒置，远离火源、热源。应当置于儿童、无关人员及动物接触不到的地方，并加锁保存。'},
{id:'LV056',code:'LV056',pkg:'200 g',cat:'Regulator',tag:'reg',en_name:'IBA + NAA (Rooting Agent)',zh_name:'吲丁·萘乙酸',en_tag:'Promote transplant survival, vigorous rooting, improve survival rate',zh_tag:'移栽促活，根多根壮，提高成活率',en_ingr:'NAA 2.5% + IBA 2.5% (Hormone: Auxin | MOA: Stimulates adventitious root formation via auxin response pathway)',zh_ingr:'萘乙酸2.5% + 吲哚丁酸2.5%（激素类型：生长素（Auxin）| 作用机制：通过生长素响应通路诱导不定根形成）',en_bene:'Stimulates adventitious root formation at cuttings. Promotes cell division and elongation for faster root development. Reduces transplant trauma through hormone balancing, reduces mortality.',zh_bene:'刺激根原基形成，诱导不定根在切口或基部形成，从而加速生根过程。促进细胞分裂与细胞伸长，从而加快根系延伸与发育。在移栽或应激条件下，可通过激素平衡缓解移栽创伤、减少死亡。',en_meth:[['Grapes (cuttings)','Dilute 250-500x, soak cutting base for 2-3 hours']],zh_meth:[['葡萄（扦插）','250-500倍液，浸泡插条基部2-3小时']],en_prec:'Cannot be mixed with copper products or alkaline pesticides. Use only once per season.',zh_prec:'不可与铜制品或碱性农药混用。每季使用一次。'},
{id:'LV014',code:'LV014',pkg:'1 L',cat:'Adjuvant',tag:'adj',en_name:'Long Tou Adjuvant',zh_name:'陇透 增效助剂',en_tag:'Rain-resistant, enhances efficacy, accelerates uptake',zh_tag:'耐雨水冲刷，提升药效，加速内吸，不伤作物',en_ingr:'Lecithin + fatty alcohol ether polymer',zh_ingr:'卵磷脂+脂肪醇醚聚合物',en_bene:'Improves penetration and absorption of foliar fertilizers, pesticides and regulators. Enhances wetting, spreading and adhesion. Reduces spray loss.',zh_bene:'有效提高叶面肥、农药、调节剂在植物叶片表面的渗透性与吸收效率。增强喷雾液的润湿、展着与附着能力，使药液更均匀覆盖作物表面。减少喷雾流失，提升肥效与药效持久性。',en_meth:[['Foliar','Dilute 1000-2000x; add adjuvant first, then fertilizer/pesticide']],zh_meth:[['叶面喷雾','稀释1000-2000倍与相关药剂混配使用，先加陇透，后加肥料或农药混合均匀后喷雾']],en_prec:'Efficacy enhancer -- ineffective alone; must be tank-mixed with a pesticide, foliar fertiliser or other spray product. Can be mixed with most pesticides; saves water. When mixing with unfamiliar or potentially phytotoxic products, conduct a safety test first before large-scale use. Use within 4 hours of mixing. Spray uniformly; leaves should be wet but not dripping. Store in cool dry place away from children; rinse skin contact with water.',zh_prec:'本品为增效剂，单独使用无效，需桶混药剂使用，在使用时可适当减少药剂用量。本品能与多种农药混配，能节约用水；与不明成分及易产生药害的药剂混配时，需要进行安全性验证，确定安全后方可应用，否则不建议使用。即配即用，配好的农药应在4小时内完成喷雾。施药时需均匀喷雾，喷雾量以叶片形成水膜但不滴水为宜。请贮存于阴凉、干燥的环境中，远离儿童；接触皮肤请立即清洗。'},
{id:'LV031',code:'LV031',pkg:'1 L',cat:'Adjuvant',tag:'adj',en_name:'Organic Silicon Adjuvant',zh_name:'有机硅助增效剂',en_tag:'Boosts pesticide & foliar fertiliser efficacy, rain-resistant, fast spreading, strong adhesion',zh_tag:'提高农药及叶面肥效果，防雨淋，扩展快，黏着强',en_ingr:'Polyether-modified trisiloxane',zh_ingr:'聚醚改性三硅氧烷',en_bene:'Extreme spreading ability -- spray solution rapidly spreads across leaf surfaces, fruit surfaces and hard-to-reach areas (leaf backs, crevices, fruit stems) for complete, uniform coverage. High-efficiency penetration through cuticle and stomata to enhance absorption and translocation of systemic pesticides and foliar nutrients. Fast film formation with very strong rain resistance -- even light rain after application will not wash off the spray, protecting efficacy.',zh_bene:'极强展着性，药液能迅速铺展于叶面、果面，均匀覆盖不留死角，对叶背、叶缝、果蒂等部位也能迅速覆盖，提高施药效率。高效渗透，穿透角质层、气孔进入作物组织，提高内吸性农药及叶面肥的传导效率。有机硅成膜快、附着力强，即使喷药后遇到小雨，也不易被冲刷，大幅降低施药风险，保障农药及叶面肥效果稳定发挥。',en_meth:[['Foliar spray','Dilute 1500–3000x; 10–15 ml per 15–20 L of prepared spray solution. Add this product last after mixing pesticide or foliar fertiliser; let stand 5 minutes before spraying. Use immediately — do not store mixed solution.']],zh_meth:[['叶面喷雾','1500–3000倍液，10–15毫升兑水15–20L。配药时请先配好农药或叶面肥液，最后加入本品，静置5分钟后立即喷施，请现配现用。']],en_prec:'1. Spray uniformly; leaf surface should be wet but not dripping.\n2. Mix order: prepare pesticide or foliar fertiliser solution first, add this product last, stand 5 min, use immediately.\n3. CAUTION with phytotoxic or burn-prone products: when tank-mixing with pesticides or foliar fertilisers that may cause phytotoxicity or fertiliser burn, reduce the concentration of the pesticide or foliar fertiliser. Always conduct a small-area safety trial first before large-scale application.\n4. Use with caution on sensitive crops such as cucurbits and legumes.\n5. Must always be tank-mixed with a pesticide or foliar fertiliser — do not use alone.',zh_prec:'1. 施药时需均匀喷雾，喷雾量以叶片形成水膜但不滴水为宜。\n2. 配药顺序：请先配好农药或叶面肥液，最后加入本品，静置5分钟，请现配现用。\n3. 注意药肥安全性：本品与易引起药害或肥害的农药、叶面肥混用时，必须降低农药、叶面肥的使用浓度，同时应先做小面积试验确认无害后，再大面积使用。\n4. 瓜类和豆类等敏感作物请谨慎使用。\n5. 本品无毒无药害，只能与农药或叶面肥配合使用，请勿单独使用。'}
];

 'LV062+LV016':{warn:1,en:'Caution: Quinoline copper may reduce calcium bioavailability. Apply separately.',zh:'注意：喹啉铜可能降低钙的生物有效性，建议分开施用。'},
 // PGRs + fungicides/insecticides → generally ok
 'LV028+LV032':{ok:1,en:'Compatible. Brassinolide and fungicide can be co-applied. May enhance stress recovery after disease.',zh:'兼容。芸苔素与杀菌剂可以混用，有助于病后恢复生长。'},
 'LV023+LV032':{ok:1,en:'Compatible. Nitrophenolate and fungicide can be co-applied.',zh:'兼容。复硝酚钠与杀菌剂可以混用。'},
 // Boron + MKP → compatible (both are soluble, different modes)
 'LV016+LV003':{ok:1,en:'Compatible. Liquid boron and MKP are both water-soluble and work well together.',zh:'兼容。流体硼与磷酸二氢钾均为水溶性，可以混用。'},
 'LV030+LV003':{ok:1,en:'Compatible. Fluid boron and MKP are compatible.',zh:'兼容。流体硼与磷酸二氢钾兼容。'},
 // LV026 (multi-element) is generally safe with most products
 'LV026+LV007':{ok:1,en:'Compatible. Multi-element supplement and humic acid work well together.',zh:'兼容。十全十美与黄腐酸钾配合使用效果好。'},
 // ── Nutrient wheel antagonism rules ────────────────────────────────────────
 // High-K + Calcium: excess K competes with Ca and Mg at root uptake sites
 'LV010+LV027':{warn:1,en:'Caution: High-K fertilizer + calcium — excess K competes with Ca/Mg uptake at root. Apply on alternate days if possible.',zh:'注意：高钾肥料与钙肥共用时，过量钾离子会与钙、镁竞争根系吸收位点。建议交替施用。'},
 'LV010+LV041':{warn:1,en:'Caution: High-K fertilizer + calcium — excess K competes with Ca/Mg uptake at root.',zh:'注意：高钾肥料与钙肥共用时，过量钾离子会与钙、镁竞争根系吸收位点。'},
 'LV010+LV042':{warn:1,en:'Caution: High-K fertilizer + calcium — excess K competes with Ca/Mg uptake at root.',zh:'注意：高钾肥料与钙肥共用时，过量钾离子会与钙、镁竞争根系吸收位点。'},
 'LV013+LV027':{warn:1,en:'Caution: High-K (13-7-40) + calcium — excess K antagonises Ca/Mg uptake.',zh:'注意：高钾配方（13-7-40）与钙肥共用时，存在钾-钙拮抗作用。'},
 'LV013+LV041':{warn:1,en:'Caution: High-K (13-7-40) + calcium — excess K antagonises Ca/Mg uptake.',zh:'注意：高钾配方（13-7-40）与钙肥共用时，存在钾-钙拮抗作用。'},
 'LV045+LV027':{warn:1,en:'Caution: K2SO4 + calcium — high K competes with Ca uptake. Apply separately.',zh:'注意：硫酸钾与钙肥同施，高钾拮抗钙的吸收，建议分开施用。'},
 'LV045+LV041':{warn:1,en:'Caution: K2SO4 + calcium — high K competes with Ca uptake.',zh:'注意：硫酸钾与钙肥同施，高钾拮抗钙的吸收。'},
 // High-P + micro-elements: excess P inhibits Zn, Fe, B, Cu uptake
 'LV003+LV022':{warn:1,en:'Caution: MKP (high P) + multi-element — excess phosphate inhibits Zn, Fe and B absorption from this product.',zh:'注意：磷酸二氢钾（高磷）与钙镁硼锌铁同用，过量磷会抑制锌、铁、硼的吸收。'},
 'LV004+LV022':{warn:1,en:'Caution: MKP (high P) + multi-element — excess phosphate inhibits Zn, Fe and B absorption.',zh:'注意：磷酸二氢钾（高磷）与钙镁硼锌铁同用，过量磷会抑制锌、铁、硼的吸收。'},
 'LV003+LV026':{warn:1,en:'Caution: MKP (high P) + micro-element mix — excess P can inhibit Zn and Fe uptake.',zh:'注意：磷酸二氢钾（高磷）与十全十美同用，过量磷会抑制锌和铁的吸收，建议错开施用。'},
 'LV004+LV026':{warn:1,en:'Caution: MKP (high P) + micro-element mix — excess P can inhibit Zn and Fe uptake.',zh:'注意：磷酸二氢钾与十全十美同用，高磷抑制锌铁吸收。'},
 'LV009+LV022':{warn:1,en:'Caution: High-P fertilizer (10-50-6) + multi-element — very high P content may inhibit Zn, Fe and B uptake from this product.',zh:'注意：高磷配方（10-50-6）磷含量极高，与钙镁硼锌铁同施可能抑制锌、铁、硼的吸收，建议错开施用。'},
 'LV009+LV026':{warn:1,en:'Caution: High-P fertilizer (10-50-6) + micro-element mix — high P inhibits Zn and Fe uptake.',zh:'注意：高磷配方（10-50-6）与微量元素同施，高磷抑制锌铁吸收。'},
 // Granular Zn (high conc) + Fe/multi-element → Zn-Fe antagonism
 'LV047+LV022':{warn:1,en:'Caution: Granular Zn at high soil concentration antagonises Fe and Mn uptake — do not over-apply alongside products containing Fe/Mn.',zh:'注意：颗粒锌在土壤中浓度过高会拮抗铁和锰的吸收，与含铁锰产品同用时请勿超量。'},
 // Ca + multi-element: high Ca may inhibit B, Fe, Zn from LV022
 'LV022+LV027':{warn:1,en:'Caution: Mixing Ca + multi-element (Ca/Mg/B/Zn/Fe) — high calcium may antagonise B, Zn and Fe uptake at high rates.',zh:'注意：高浓度钙与钙镁硼锌铁混用，高钙可能抑制硼、锌、铁的吸收，建议适量使用。'},
 'LV022+LV041':{warn:1,en:'Caution: Mixing Ca + multi-element — high calcium may antagonise B, Zn and Fe uptake.',zh:'注意：高浓度钙与钙镁硼锌铁混用，高钙可能抑制硼、锌、铁的吸收。'},
 // Ca-Mg-Si (LV064) + MKP → precipitation (LV064 contains calcium)
 'LV064+LV003':{danger:1,en:'INCOMPATIBLE. LV064 (Ca-Mg-Si) contains calcium — mixing with MKP (phosphate) will cause calcium phosphate precipitation.',zh:'不可混用！阿蒂米斯含钙，与磷酸二氢钾（含磷酸盐）混用会产生磷酸钙沉淀。'},
 'LV064+LV004':{danger:1,en:'INCOMPATIBLE. LV064 (Ca-Mg-Si) contains calcium — mixing with MKP (phosphate) will cause calcium phosphate precipitation.',zh:'不可混用！阿蒂米斯含钙，与磷酸二氢钾混用会产生磷酸钙沉淀。'},
 // Ca-Mg-Si + calcium = synergistic (Si enhances Ca function)
 'LV064+LV027':{ok:1,en:'Compatible. Ca-Mg-Si and calcium liquid are synergistic — silicon strengthens cell walls and enhances calcium translocation.',zh:'兼容。阿蒂米斯（钙镁硅）与液体钙配合，硅元素可增强细胞壁并促进钙的运转，效果协同。'},
 'LV064+LV041':{ok:1,en:'Compatible. Ca-Mg-Si and calcium are synergistic. Silicon strengthens cell walls and enhances calcium function.',zh:'兼容。钙镁硅与钙肥协同，硅可增强细胞壁结构、促进钙的生理功能。'},
 // Boron + calcium = synergistic (B needed for Ca transport) — at label rates
 'LV016+LV027':{ok:1,en:'Recommended. Boron is essential for calcium translocation in the plant. Apply together for best fruit set.',zh:'推荐组合。硼是植株体内钙运转的必要元素，硼钙配合施用有助于提高坐果率和果实品质。'},
 'LV030+LV027':{ok:1,en:'Recommended. Boron + calcium are synergistic — boron enables calcium to move within the plant.',zh:'推荐组合。硼与钙协同，硼能促进钙在植株内的运转，两者配合效果更好。'},
 'LV016+LV041':{ok:1,en:'Recommended. Boron + calcium synergy — boron enables calcium translocation.',zh:'推荐组合。硼钙协同，硼促进钙的运转，配合施用提高坐果率。'},
 // K2SO4 + high-N: balanced, but note ratio
 'LV045+LV008':{warn:1,en:'Caution: K2SO4 (pure K) paired with very high-N (30-10-10) — ensure K:N ratio is appropriate for the growth stage.',zh:'注意：硫酸钾与高氮肥（30-10-10）同施，注意根据生长阶段调整氮钾比例，避免营养失衡。'},
 // Humic acid chelates micronutrients — synergistic
 'LV007+LV022':{ok:1,en:'Recommended. Humic acid chelates Fe, Zn, Mn and B in LV022, significantly improving their absorption efficiency.',zh:'推荐组合。矿源黄腐酸钾可络合钙镁硼锌铁中的铁、锌、锰、硼，显著提高微量元素吸收利用率。'},
 'LV007+LV026':{ok:1,en:'Recommended. Humic acid chelates and improves absorption of micro-elements.',zh:'推荐组合。黄腐酸钾络合微量元素，提高十全十美中各元素的吸收利用率。'},
 'LV065+LV022':{ok:1,en:'Recommended. Humic acid chelates micro-elements and improves absorption efficiency.',zh:'推荐组合。黄腐酸钾络合钙镁硼锌铁，提高微量元素吸收。'},
 // Si (LV064) + K: generally fine, Si improves nutrient use efficiency
 'LV064+LV010':{ok:1,en:'Compatible. Silicon improves potassium use efficiency and strengthens cell walls during fruit development.',zh:'兼容。硅能提高钾的利用效率，并在果实发育期增强细胞壁结构。'},
 'LV064+LV045':{ok:1,en:'Compatible. Ca-Mg-Si and K2SO4 complement each other well during fruit enlargement and colour change.',zh:'兼容。钙镁硅与硫酸钾在膨果期和转色期配合使用，相互补充，效果好。'},
 // ── Concentrate-level physical/chemical dangers ──────────────────────────────
 // Boron (LV016/LV030, B≥150g/L, alkaline pH8-9) + Calcium (LV027/LV041/LV042)
 // → calcium borate precipitate at high concentration — MUST pre-dilute separately
 'LV016+LV027':{warn:1,en:'Boron and calcium are agronomically synergistic but MUST NOT be mixed as concentrates. Calcium borate precipitates immediately at high concentration. Always pre-dilute each separately in half a tank of water, then combine.',zh:'硼与钙在农业上具有协同作用，但绝不可将浓缩液直接混合！高浓度下钙与硼酸盐反应生成硼酸钙沉淀，立即堵塞管路。正确做法：将两者分别用半桶水稀释后，再混合使用。'},
 'LV030+LV027':{warn:1,en:'Boron and calcium are agronomically synergistic but MUST NOT be mixed as concentrates. Calcium borate precipitates immediately at high concentration. Always pre-dilute each separately in half a tank of water, then combine.',zh:'硼与钙在农业上具有协同作用，但绝不可将浓缩液直接混合！高浓度下钙与硼酸盐反应生成硼酸钙沉淀，立即堵塞管路。正确做法：将两者分别用半桶水稀释后，再混合使用。'},
 'LV016+LV041':{warn:1,en:'Boron and calcium are agronomically synergistic but MUST NOT be mixed as concentrates. Calcium borate precipitates immediately at high concentration. Pre-dilute each separately first.',zh:'硼与钙在农业上具有协同作用，但绝不可将浓缩液直接混合！高浓度下生成硼酸钙沉淀。请分别用水稀释后再混合。'},
 'LV030+LV041':{warn:1,en:'Boron and calcium are agronomically synergistic but MUST NOT be mixed as concentrates. Pre-dilute each separately first.',zh:'硼与钙在农业上具有协同作用，但绝不可将浓缩液直接混合！请分别用水稀释后再混合。'},
 'LV016+LV042':{warn:1,en:'Boron + sugar alcohol calcium: pre-dilute each separately before combining to avoid borate-calcium interaction.',zh:'硼与糖醇钙：混合前请分别用水稀释，避免硼酸钙沉淀问题。'},
 'LV030+LV042':{warn:1,en:'Boron + sugar alcohol calcium: pre-dilute each separately before combining.',zh:'流体硼与糖醇钙：混合前请分别用水稀释。'},
 // LV019 (亚磷酸钾, very acidic pH~2-3) + alkaline products = violent reaction
 'LV019+LV027':{danger:1,en:'DANGER. Potassium phosphonate (LV019) is highly acidic (pH~2-3). Direct mixing with liquid calcium (alkaline pH8-10) causes violent pH clash and calcium phosphonate precipitation. Always add each separately to water — never mix concentrates.',zh:'危险！亚磷酸钾（LV019）极度酸性（pH约2-3），与液体钙（碱性pH 8-10）直接混合会引发剧烈pH冲突并生成亚磷酸钙沉淀。必须分别加入水中稀释，严禁浓缩液直接相混。'},
 'LV019+LV041':{danger:1,en:'DANGER. Potassium phosphonate (LV019, pH~2-3) + calcium — violent pH clash and precipitation. Never mix concentrates.',zh:'危险！亚磷酸钾（pH~2-3）与钙肥直接混合引发剧烈pH冲突和沉淀。严禁浓缩液直接相混。'},
 'LV019+LV042':{danger:1,en:'DANGER. Potassium phosphonate (LV019, pH~2-3) + sugar alcohol calcium — violent pH clash. Dilute each separately in water first.',zh:'危险！亚磷酸钾（pH~2-3）与糖醇钙直接混合引发剧烈pH冲突。必须分别加水稀释后再混合。'},
 'LV019+LV016':{danger:1,en:'DANGER. Potassium phosphonate (LV019, pH~2-3) + liquid boron (alkaline pH8-9) — severe pH clash destroys boron solubility. Never mix concentrates.',zh:'危险！亚磷酸钾（pH~2-3）与流体硼（碱性pH 8-9）直接混合，剧烈pH冲突导致硼溶解度崩溃。严禁浓缩液直接相混。'},
 'LV019+LV030':{danger:1,en:'DANGER. Potassium phosphonate (LV019, pH~2-3) + fluid boron (alkaline) — severe pH clash. Never mix concentrates.',zh:'危险！亚磷酸钾（pH~2-3）与流体硼（碱性）直接混合，剧烈pH冲突。严禁浓缩液直接相混。'},
 // Copper fungicides + alkaline calcium = Cu(OH)₂ precipitate
 'LV058+LV027':{danger:1,en:'DANGER. Copper-based fungicide (LV058) + liquid calcium (alkaline pH8-10) — Cu²⁺ precipitates as Cu(OH)₂ at high pH. Never mix concentrates. If using both, add copper to diluted water first.',zh:'危险！铜制杀菌剂（LV058）与液体钙（碱性pH 8-10）直接混合，高pH导致铜离子以Cu(OH)₂形式沉淀。严禁浓缩液直接相混。如需同用，先将铜制剂加入稀释水中。'},
 'LV062+LV027':{danger:1,en:'DANGER. Quinoline copper (LV062) + liquid calcium (alkaline) — copper precipitates as Cu(OH)₂ at high pH. Never mix concentrates.',zh:'危险！喹啉铜（LV062）与液体钙（碱性）直接混合，高pH下铜离子形成Cu(OH)₂沉淀。严禁浓缩液直接相混。'},
 'LV058+LV041':{danger:1,en:'DANGER. Copper fungicide + calcium (alkaline) — copper precipitates at high pH. Never mix concentrates.',zh:'危险！铜制杀菌剂与钙肥（碱性）直接混合，高pH导致铜沉淀。严禁浓缩液直接相混。'},
 'LV062+LV041':{danger:1,en:'DANGER. Quinoline copper + calcium (alkaline) — copper precipitates at high pH. Never mix concentrates.',zh:'危险！喹啉铜与钙肥（碱性）直接混合，高pH下铜离子沉淀。严禁浓缩液直接相混。'},

 // ── Copper (LV058, LV062) + organic N/protein products ──────────────────────
 // Cu²⁺ chelation by amino acids reduces fungicidal activity; fish protein precipitates at high Cu
 'LV058+LV020':{warn:1,en:'Caution: Copper (LV058) + amino acid (LV020) — free amino acids chelate Cu²⁺ ions in the tank, reducing fungicidal activity. Apply separately or reduce Cu rate and monitor efficacy.',zh:'注意：铜制剂（LV058）与氨基酸（LV020）混用——游离氨基酸会在桶内螯合铜离子，降低杀菌效果。建议分开施用，或降低铜制剂用量并监测防效。'},
 'LV062+LV020':{warn:1,en:'Caution: Copper (LV062) + amino acid (LV020) — amino acids chelate Cu²⁺, reducing fungicidal efficacy. Apply separately where possible.',zh:'注意：铜制剂（LV062）与氨基酸（LV020）混用——氨基酸螯合铜离子，降低杀菌效果。建议尽量分开施用。'},
 'LV058+LV066':{warn:1,en:'Caution: Copper (LV058) + amino acid powder (LV066) — high amino acid concentration strongly chelates Cu²⁺, significantly reducing fungicidal activity. Apply separately.',zh:'注意：铜制剂（LV058）与氨基酸原粉（LV066）混用——高浓度氨基酸对铜离子螯合作用强，显著降低杀菌效果。建议分开施用。'},
 'LV062+LV066':{warn:1,en:'Caution: Copper (LV062) + amino acid powder (LV066) — high amino acid concentration chelates Cu²⁺ and reduces fungicidal activity. Apply separately.',zh:'注意：铜制剂（LV062）与氨基酸原粉（LV066）混用——高浓度氨基酸螯合铜离子，降低杀菌效果。建议分开施用。'},
 'LV058+LV018':{warn:1,en:'Caution: Copper (LV058) + fish protein (LV018) — Cu²⁺ can denature and precipitate proteins at high concentration, reducing both copper activity and fish protein efficacy. Do a jar test first.',zh:'注意：铜制剂（LV058）与鱼蛋白（LV018）混用——高浓度铜离子可使蛋白质变性沉淀，降低铜制剂和鱼蛋白的双重效果。建议先进行混配试验。'},
 'LV062+LV018':{warn:1,en:'Caution: Copper (LV062) + fish protein (LV018) — Cu²⁺ can denature proteins, reducing both products\' efficacy. Do a jar test; apply separately if any precipitate forms.',zh:'注意：铜制剂（LV062）与鱼蛋白（LV018）混用——铜离子可使蛋白质变性，降低双方效果。建议先做混配试验，出现沉淀则分开施用。'},
 'LV058+LV051':{warn:1,en:'Caution: Copper (LV058) + seaweed-fish protein (LV051) — Cu²⁺ may precipitate proteins in the formulation at high concentration. Do a jar test first.',zh:'注意：铜制剂（LV058）与海藻鱼蛋白（LV051）混用——铜离子可能在高浓度下使配方中的蛋白质沉淀。建议先做混配试验。'},
 'LV062+LV051':{warn:1,en:'Caution: Copper (LV062) + seaweed-fish protein (LV051) — Cu²⁺ may precipitate proteins. Do a jar test; apply separately if any precipitate forms.',zh:'注意：铜制剂（LV062）与海藻鱼蛋白（LV051）混用——铜离子可能使蛋白质沉淀。建议先做混配试验，出现沉淀则分开施用。'},

 // ── Copper (LV058, LV062) + fulvic/humic acid ────────────────────────────────
 // Fulvic/humic acid chelates Cu²⁺, reducing fungicidal activity; also pH conflict at concentrate level
 'LV058+LV007':{warn:1,en:'Caution: Copper fungicide (LV058) + fulvic acid (LV007, pH 8-11) — fulvic acid chelates Cu²⁺ ions, reducing fungicidal activity. Alkaline pH also risks Cu(OH)₂ formation at high concentration. Apply in separate applications.',zh:'注意：铜制杀菌剂（LV058）与矿源黄腐酸钾（LV007，pH 8-11）混用——黄腐酸螯合铜离子，降低杀菌效果；高浓度下碱性pH还可能导致Cu(OH)₂沉淀。建议分开施用。'},
 'LV062+LV007':{warn:1,en:'Caution: Copper fungicide (LV062) + fulvic acid (LV007, pH 8-11) — fulvic acid chelates Cu²⁺, reducing fungicidal efficacy. Apply in separate applications.',zh:'注意：铜制杀菌剂（LV062）与矿源黄腐酸钾（LV007，pH 8-11）混用——黄腐酸螯合铜离子，降低杀菌效果。建议分开施用。'},
 'LV058+LV065':{warn:1,en:'Caution: Copper fungicide (LV058) + fulvic acid (LV065, pH 6-8) — fulvic acid chelates Cu²⁺, reducing fungicidal activity. Less severe than LV007 (lower pH) but still apply separately.',zh:'注意：铜制杀菌剂（LV058）与矿源黄腐酸钾小包装（LV065，pH 6-8）混用——黄腐酸螯合铜离子，降低杀菌效果。pH影响低于LV007，但仍建议分开施用。'},
 'LV062+LV065':{warn:1,en:'Caution: Copper fungicide (LV062) + fulvic acid (LV065) — fulvic acid chelates Cu²⁺ and reduces fungicidal efficacy. Apply separately.',zh:'注意：铜制杀菌剂（LV062）与矿源黄腐酸钾小包装（LV065）混用——黄腐酸螯合铜离子，降低杀菌效果。建议分开施用。'},

 // ── Copper (LV058, LV062) + rooting agent LV056 ─────────────────────────────
 // LV056 label explicitly states incompatible with copper compounds
 'LV058+LV056':{danger:1,en:'INCOMPATIBLE. LV056 (IBA+NAA rooting agent) label explicitly states: cannot be mixed with copper compounds. Copper ions destroy auxin activity and can cause phytotoxicity at the root zone.',zh:'不可混用！LV056（吲丁·萘乙酸生根剂）标签明确标注：不可与铜制品混用。铜离子会破坏生长素活性，并可能对根区产生药害。'},
 'LV062+LV056':{danger:1,en:'INCOMPATIBLE. LV056 (IBA+NAA rooting agent) cannot be mixed with copper compounds. Copper ions destroy auxin activity.',zh:'不可混用！LV056（生根剂）标签明确标注不可与铜制品混用。铜离子破坏生长素（IAA/IBA）活性。'},

 // ── Prochloraz (LV063) + microelement products ───────────────────────────────
 // Prochloraz (imidazole) chelates divalent metals Zn²⁺, Fe²⁺, Mn²⁺ — reduces microelement bioavailability

function renderMOA(id){
 var rows=MOA[id];if(!rows)return'';
 var arr=lang==='zh'?rows.zh:rows.en;
 var h='';
 for(var i=0;i<arr.length;i++){
  h+='<div class="moa-row">'
    +'<span class="moa-badge"><span class="'+arr[i].cls+'">'+arr[i].badge+'</span></span>'
    +'<span class="moa-text">'+arr[i].text+'</span>'
    +'</div>';
 }
 return h;
}
function badgify(s){
 s=s.replace(/\(FRAC BM(\d+)\)/g,'<span class="bm">FRAC BM$1</span>');
 s=s.replace(/（FRAC BM(\d+)）/g,'<span class="bm">FRAC BM$1</span>');
 s=s.replace(/\(FRAC (M?\d+)\)/g,'<span class="frac">FRAC $1</span>');
 s=s.replace(/\(IRAC (\d+[A-Z]?)\)/g,'<span class="irac">IRAC $1</span>');
 s=s.replace(/（FRAC (M?\d+)）/g,'<span class="frac">FRAC $1</span>');
 s=s.replace(/（IRAC (\d+[A-Z]?)）/g,'<span class="irac">IRAC $1</span>');
 // PGR: render Hormone and MOA as pink badges, pipe as separator
 s=s.replace(/\(Hormone: ([^|]+) \| MOA: ([^)]+)\)/g,
   '<span class="pgr">Hormone: $1</span><span class="pgr">MOA: $2</span>');
 s=s.replace(/（激素类型：([^|]+) \| 作用机制：([^）]+)）/g,
   '<span class="pgr">激素类型: $1</span><span class="pgr">作用机制: $2</span>');
 return s;
}

function renderRotation(code){
 var rd=ROT_DATA[code];
 if(!rd)return'';
 var d=lang==='zh'?rd.zh:rd.en;
 var canLabel=lang==='zh'?'✓ 推荐轮换产品':'✓ Recommended rotation products';
 var cannotLabel=lang==='zh'?'✗ 不可轮换（相同组别）':'✗ Cannot rotate (same group)';
 var h='<div class="rot-section">';
 if(d.can&&d.can.length){
  h+='<div class="rot-title can">'+canLabel+'</div>';
  for(var i=0;i<d.can.length;i++){
   h+='<div class="rot-row"><span class="rot-pid">'+d.can[i].pid+'</span><span class="rot-reason"><strong>'+d.can[i].name+'</strong> — '+d.can[i].reason+'</span></div>';
  }
 }
 if(d.cannot&&d.cannot.length){
  h+='<div class="rot-title cannot" style="margin-top:6px">'+cannotLabel+'</div>';
  for(var j=0;j<d.cannot.length;j++){
   h+='<div class="rot-row"><span class="rot-pid no">'+d.cannot[j].pid+'</span><span class="rot-reason"><strong>'+d.cannot[j].name+'</strong> — '+d.cannot[j].reason+'</span></div>';
  }
 }
 h+='</div>';
 return h;
}
function getMOAGroups(pid){
 return PROD_MOA_GROUPS[pid]||[];
}

function getSharedGroups(pid1,pid2){
 var g1=getMOAGroups(pid1);
 var g2=getMOAGroups(pid2);
 var shared=[];
 for(var i=0;i<g1.length;i++){if(g2.indexOf(g1[i])>=0)shared.push(g1[i]);}
 return shared;
}

 'LV023':{
  en:[{badge:'Auxin-like',cls:'pgr',text:'Cell activator — Sodium nitrophenolate rapidly penetrates plant tissue and promotes cytoplasmic streaming, accelerating intracellular nutrient transport and metabolic activity. Stimulates root and shoot cell division, breaks seed dormancy, and increases auxin-mediated growth responses.'}],
  zh:[{badge:'类生长素',cls:'pgr',text:'细胞激活剂 — 复硝酚钠迅速渗透植物组织，促进细胞质流动，加速细胞内营养物质运输和代谢活性。刺激根系和茎叶细胞分裂，打破种子休眠，增强生长素介导的生长响应。'}]
 },
 'LV028':{
  en:[{badge:'Brassinosteroid',cls:'pgr',text:'BR signalling pathway activator — 14-OH Brassinolide binds BRI1 receptor kinase on the cell membrane, activating the BR signal transduction cascade (BRI1-BAK1-BSK1-BSU1-BIN2). This promotes cell elongation, division, and differentiation, while upregulating stress-response genes (ICE-CBF-COR pathway for cold tolerance).'}],
  zh:[{badge:'油菜素甾醇',cls:'pgr',text:'BR信号通路激活剂 — 14羟基芸苔素甾醇与细胞膜上的BRI1受体激酶结合，激活油菜素甾醇信号转导级联（BRI1-BAK1-BSK1-BSU1-BIN2）。促进细胞伸长、分裂和分化，同时上调抗逆基因表达（ICE-CBF-COR途径增强耐寒性）。'}]

 'LV056':{
