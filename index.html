function renderMRL(pid){
 var d=MRL_DATA[pid];
 if(!d||!d.length)return'';
 var u=ui();
 var html='';
 var isBio=d.length>0&&d[0].en&&d[0].en.length>0&&d[0].en[0].mrl.indexOf('EXEMPT')>=0;
 if(isBio){
  html+='<div class="mrl-bio-banner"><strong>&#129440; '+(u.mrlBioNote||'Living organism — MRL exempt, PHI = 0 days')+'</strong></div>';
 }
 for(var i=0;i<d.length;i++){
  var ai=d[i];
  html+='<div class="mrl-ai">'+ai.ai+'</div>';
  var rows=lang==='zh'?ai.zh:ai.en;
  for(var j=0;j<rows.length;j++){
   var r=rows[j];
   var isWarn=r.mrl.indexOf('0.05')>=0||r.mrl.indexOf('0.07')>=0;
   var isNa=r.mrl.indexOf('Not specifically')>=0||r.mrl.indexOf('未作具体')>=0||r.mrl.indexOf('Exempt')>=0||r.mrl.indexOf('豁免')>=0;
   var cls=isNa?'na':isWarn?'warn':'';
   html+='<div class="mrl-row"><span class="mrl-food">'+r.food+'</span><span class="mrl-val '+cls+'">'+r.mrl+'</span></div>';
   html+='<div class="mrl-note-text">'+r.note+'</div>';
  }
  // PHI row
  if(ai.phi_days!==undefined){
   var phiLabel=lang==='zh'?ai.phi_zh:ai.phi_en;
   var phiDays=ai.phi_days;
   var phiCls=phiDays>=14?'warn':phiDays===0?'na':'';
   var phiBadge=phiDays===0
    ?'<span class="mrl-val na">'+(lang==='zh'?'无需':'Not required')+'</span>'
    :'<span class="mrl-val '+phiCls+'">'+phiDays+' '+u.phiDays+'</span>';
   html+='<div class="mrl-row" style="margin-top:3px;padding-top:3px;border-top:0.5px dashed #e0e0e0">'
    +'<span class="mrl-food" style="color:#0F6E56;font-weight:500">'+u.phi+'</span>'
    +phiBadge
    +'</div>';
   html+='<div class="mrl-note-text">'+phiLabel+'</div>';
  }
  // DT50 / viability section
  if(ai.dt50_foliar){
   var fc=ai.dt50_foliar_class==='S'?'dt-S':ai.dt50_foliar_class==='M'?'dt-M':ai.dt50_foliar_class==='L'?'dt-L':'dt-VL';
   var sc=ai.dt50_soil_class==='S'?'dt-S':ai.dt50_soil_class==='M'?'dt-M':ai.dt50_soil_class==='L'?'dt-L':'dt-VL';
   var flbl=lang==='zh'
    ?{S:'短 <10天',M:'中等 10-30天',L:'长 30-100天',VL:'极长 >100天'}
    :{S:'Short',M:'Medium',L:'Long',VL:'Very Long'};
   var fn=lang==='zh'?ai.dt50_foliar_zh:ai.dt50_foliar_en;
   var sn=lang==='zh'?ai.dt50_soil_zh:ai.dt50_soil_en;
   var fLabel=lang==='zh'?(isBio?'叶面存活期':'叶面DT\u2085\u2080'):(isBio?'Foliar Viability':'Foliar DT\u2085\u2080');
   var sLabel=lang==='zh'?(isBio?'土壤持效期':'土壤DT\u2085\u2080'):(isBio?'Soil Persistence':'Soil DT\u2085\u2080');
   html+='<div class="dt50-block">';
   html+='<div class="dt50-row"><span class="dt50-label">'+fLabel+'</span>'
    +'<span class="dt50-val '+fc+'">~'+ai.dt50_foliar+' days <span class="dt50-badge '+fc+'">'+(flbl[ai.dt50_foliar_class]||'')+'</span></span></div>';
   html+='<div class="dt50-note">'+fn+'</div>';
   html+='<div class="dt50-row"><span class="dt50-label">'+sLabel+'</span>'
    +'<span class="dt50-val '+sc+'">~'+ai.dt50_soil+' days <span class="dt50-badge '+sc+'">'+(flbl[ai.dt50_soil_class]||'')+'</span></span></div>';
   html+='<div class="dt50-note">'+sn+'</div>';
   html+='<div class="dt50-src">'+(isBio?'&#128300;':'&#128218;')+' '+ai.dt50_src+'</div>';
   html+='</div>';
  }
 }
 html+='<div class="mrl-disclaimer"><strong>&#9888; '+u.mrlNote+'</strong></div>';
 return html;
}

function renderResistance(pid){
 var groups=PROD_MOA_GROUPS[pid];
 if(!groups||!groups.length)return'';
 var u=ui();
 var html='';
 var seen_can={}, seen_no={};
 for(var gi=0;gi<groups.length;gi++){
  var code=groups[gi];
  var rd=ROT_DATA[code];
  if(!rd)continue;
  var d=lang==='zh'?rd.zh:rd.en;
  // Collect can/cannot across all groups this product belongs to
  if(d.can){for(var ci=0;ci<d.can.length;ci++){var e=d.can[ci];if(!seen_can[e.pid]){seen_can[e.pid]=e;}}}
  if(d.cannot){for(var ni=0;ni<d.cannot.length;ni++){var f=d.cannot[ni];if(!seen_no[f.pid]){seen_no[f.pid]=f;}}}
 }
 // Remove self from both lists
 delete seen_can[pid]; delete seen_no[pid];
 // Build risk info line from groups
 var riskHtml='';
 for(var g2i=0;g2i<groups.length;g2i++){
  var gc=groups[g2i];
  var allg=FRAC_GROUPS.concat(IRAC_GROUPS);
  for(var ai=0;ai<allg.length;ai++){
   if(allg[ai].code===gc){
    var gd=lang==='zh'?allg[ai].zh:allg[ai].en;
    var rc=getRiskClass(allg[ai].risk);
    var bcls=gc.indexOf('BM')>=0?'bm':gc.indexOf('IRAC')>=0?'irac':'frac';
    riskHtml+='<div class="'+rc+'" style="border-radius:6px;padding:7px 10px;margin-bottom:6px;font-size:12px;line-height:1.5">'
      +'<span class="'+bcls+'" style="margin-left:0;margin-right:6px">'+gc+'</span>'
      +'<strong>'+gd.name+'</strong><br>'
      +'<span style="color:inherit;opacity:0.85">'+gd.rule+'</span>'
      +'</div>';
    break;
   }
  }
 }
 html+=riskHtml;
 // Rotation can
 var canKeys=Object.keys(seen_can);
 if(canKeys.length){
  html+='<div class="rot-title can" style="margin-top:8px;margin-bottom:4px">'+u.resRotCan+'</div>';
  for(var ck=0;ck<canKeys.length;ck++){
   var e2=seen_can[canKeys[ck]];
   html+='<div class="rot-row"><span class="rot-pid">'+e2.pid+'</span><span class="rot-reason"><strong>'+e2.name+'</strong> — '+e2.reason+'</span></div>';
  }
 }
 // Rotation cannot
 var noKeys=Object.keys(seen_no);
 if(noKeys.length){
  html+='<div class="rot-title cannot" style="margin-top:8px;margin-bottom:4px">'+u.resRotNo+'</div>';
  for(var nk=0;nk<noKeys.length;nk++){
   var f2=seen_no[noKeys[nk]];
   html+='<div class="rot-row"><span class="rot-pid no">'+f2.pid+'</span><span class="rot-reason"><strong>'+f2.name+'</strong> — '+f2.reason+'</span></div>';
  }
 }
 return html;
}

  {ai:'Bifenazate 联苯肼酯',dt50_foliar:"3\u20137",dt50_foliar_class:"S",dt50_foliar_en:"Foliar half-life ~3\u20137 days (contact miticide \u2014 not systemic). Residues are surface-bound, so wash-off by rain reduces residues rapidly. UV photolysis contributes to dissipation.",dt50_foliar_zh:"\u53f6\u9762\u534a\u8870\u671f\u7ea63\u20137\u5929\uff08\u63a5\u89e6\u578b\u6740\u87a8\u5242\uff0c\u975e\u5185\u5438\u6027\uff09\u3002\u6b8b\u7559\u9644\u7740\u4e8e\u8868\u9762\uff0c\u964d\u96e8\u51b2\u6d17\u53ef\u8fc5\u901f\u964d\u4f4e\u6b8b\u7559\u3002\u7d2b\u5916\u5149\u89e3\u6709\u52a9\u4e8e\u6d88\u6563\u3002",dt50_soil:"5\u201320",dt50_soil_class:"S",dt50_soil_en:"Soil DT\u2085\u2080: ~5\u201320 days (PPDB). Non-systemic, low soil mobility. Degrades via microbial metabolism and hydrolysis. Low accumulation risk.",dt50_soil_zh:"\u571f\u58e4DT\u2085\u2080\uff1a\u7ea65\u201320\u5929\uff08PPDB\uff09\u3002\u975e\u5185\u5438\uff0c\u571f\u58e4\u79fb\u52a8\u6027\u4f4e\u3002\u7ecf\u5fae\u751f\u7269\u4ee3\u8c22\u548c\u6c34\u89e3\u964d\u89e3\u3002\u79ef\u7d2f\u98ce\u9669\u4f4e\u3002",dt50_src:"PPDB; JMPR",phi_days:7,phi_en:"7 days (tree fruit label PHI; apply conservatively; 1 application per season maximum)",phi_zh:"7\u5929\uff08\u679c\u6811\u6807\u7b7ePHI\uff1b\u4fdd\u5b88\u65bd\u7528\uff1b\u6bcf\u5b63\u6700\u591a1\u6b21\uff09",

 // LV060: Thiamethoxam (IRAC 4A)
 'LV060':[
  {ai:'Thiamethoxam 噻虫胺',dt50_foliar:"3\u20137",dt50_foliar_class:"S",dt50_foliar_en:"Foliar half-life ~3\u20137 days (PPDB; mango DT\u2085\u2080 4.0\u20134.5 days, Kumari 2016). Systemic \u2014 translocates into plant tissue. Surface residues dissipate faster than internal.",dt50_foliar_zh:"\u53f6\u9762\u534a\u8870\u671f\u7ea63\u20137\u5929\uff08PPDB\uff1b\u8292\u679cDT\u2085\u2080 4.0\u20134.5\u5929\uff0cKumari 2016\uff09\u3002\u5185\u5438\u6027\uff0c\u5411\u690d\u7269\u7ec4\u7ec7\u8f6c\u8fd0\u3002\u8868\u9762\u6b8b\u7559\u6d88\u6563\u5feb\u4e8e\u5185\u90e8\u6b8b\u7559\u3002",dt50_soil:"7\u201330",dt50_soil_class:"M",dt50_soil_en:"Soil DT\u2085\u2080: 7\u201330 days (PPDB aerobic). Moderate persistence. High water solubility \u2014 moderate leaching potential. Degrades via microbial hydrolysis. Residues not detectable beyond 20 days in mango fruit (Kumari 2016).",dt50_soil_zh:"\u571f\u58e4DT\u2085\u2080\uff1a7\u201330\u5929\uff08PPDB\u597d\u6c27\uff09\u3002\u4e2d\u7b49\u6301\u4e45\u6027\u3002\u6c34\u6eb6\u6027\u9ad8\uff0c\u5177\u6709\u4e00\u5b9a\u6dcb\u6eb6\u6f5c\u529b\u3002\u7ecf\u5fae\u751f\u7269\u6c34\u89e3\u964d\u89e3\u3002\u8292\u679c\u679c\u5b9e\u4e2d20\u5929\u540e\u6b8b\u7559\u4e0d\u53ef\u68c0\u51fa\uff08Kumari 2016\uff09\u3002",dt50_src:"PPDB; Kumari 2016 mango study",phi_days:7,phi_en:"7 days on mango std dose (Kumari et al. 2016 \u2014 half-life 4.0-4.5 days; below 0.2 mg/kg MRL at 7 days)",phi_zh:"\u8292\u679c\u6807\u51c6\u5242\u91cf7\u5929\uff08Kumari\u7b492016 \u2014 \u534a\u8870\u671f4.0-4.5\u5929\uff1b7\u5929\u65f6\u4f4e\u4e8eMRL 0.2 mg/kg\uff09",
   en:[
    {food:'Tropical & subtropical fruits (group)',mrl:'0.2 mg/kg',note:'GB 2763-2021 — thiamethoxam tropical fruits'},
    {food:'Durian (榴莲)',mrl:'0.2 mg/kg',note:'Inherits from tropical fruits group'}
   ],
   zh:[
    {food:'热带和亚热带类水果（类别）',mrl:'0.2 mg/kg',note:'GB 2763-2021 — 噻虫胺热带水果'},
    {food:'榴莲',mrl:'0.2 mg/kg',note:'继承热带水果类别限量'}
   ]
  }
 ],

 'LV061':[
  {ai:'Bifenthrin 联苯菊酯',dt50_foliar:"5\u201310",dt50_foliar_class:"S",dt50_foliar_en:"Foliar half-life ~5\u201310 days (PPDB RL\u2085\u2080). Contact pyrethroid \u2014 surface residues only, no systemic translocation. Photostable under UV compared to other pyrethroids. Main dissipation route: volatilisation + photodegradation.",dt50_foliar_zh:"\u53f6\u9762\u534a\u8870\u671f\u7ea65\u201310\u5929\uff08PPDB RL\u2085\u2080\uff09\u3002\u63a5\u89e6\u578b\u62df\u9664\u866b\u83ca\u916f\uff0c\u4ec5\u8868\u9762\u6b8b\u7559\uff0c\u65e0\u5185\u5438\u8f6c\u8fd0\u3002\u4e0e\u5176\u4ed6\u62df\u9664\u866b\u83ca\u916f\u76f8\u6bd4\u5bf9\u7d2b\u5916\u5149\u8f83\u7a33\u5b9a\u3002\u4e3b\u8981\u6d88\u6563\u9014\u5f84\uff1a\u6325\u53d1+\u5149\u964d\u89e3\u3002",dt50_soil:"80\u2013350",dt50_soil_class:"VL",dt50_soil_en:"Soil DT\u2085\u2080: 80\u2013350 days (PPDB \u2014 very persistent). Tightly adsorbed to soil organic matter (Koc ~100,000\u2013237,000). Does not leach but accumulates. Long persistence drives the extended PHI needed for the tight MRL of 0.05 mg/kg.",dt50_soil_zh:"\u571f\u58e4DT\u2085\u2080\uff1a80\u2013350\u5929\uff08PPDB\uff0c\u6781\u6301\u4e45\u6027\uff09\u3002\u4e0e\u571f\u58e4\u6709\u673a\u8d28\u5f3a\u70c8\u5438\u9644\uff08Koc\u7ea6100,000\u2013237,000\uff09\u3002\u4e0d\u6dcb\u6eb6\u4f46\u4f1a\u79ef\u7d2f\u3002\u9ad8\u6301\u4e45\u6027\u662f0.05 mg/kg\u4e25\u683cMRL\u9700\u8981\u8f83\u957f\u5b89\u5168\u95f4\u9694\u671f\u7684\u6839\u672c\u539f\u56e0\u3002",dt50_src:"PPDB (Herts); JMPR",phi_days:14,phi_en:"14 days for tropical fruit (tight MRL 0.05 mg/kg* requires extended PHI; half-life ~5-7 days in fruit)",phi_zh:"\u70ed\u5e26\u6c34\u679c14\u5929\uff08MRL\u4e25\u683c0.05 mg/kg*\u9700\u8f83\u957f\u95f4\u9694\u671f\uff1b\u679c\u5b9e\u534a\u8870\u671f\u7ea65-7\u5929\uff09",
   en:[
    {food:'Tropical & subtropical fruits (group)',mrl:'0.05 mg/kg',note:'GB 2763-2021 §4.198 — tropical fruits (临时限量/temporary MRL*)'},
    {food:'Durian (榴莲)',mrl:'0.05 mg/kg*',note:'Temporary MRL — inherits from tropical fruits group'}
   ],

    {food:'Durian (榴莲)',mrl:'0.2 mg/kg',note:'Inherits from tropical fruits group'}

   zh:[

// ── MICROBIAL COMBINATION GUIDE ──────────────────────────────────────────────
// Based on: Impello Bio 2025; ScienceDirect 2022 review; PMC 2008-2025 studies
// Key findings:
// - Bacillus spp. (LV005/LV024/LV054) + Trichoderma (LV006): COMPATIBLE, synergistic
// - Bacillus spp. between themselves: COMPATIBLE, complementary

function doRec(){
 var u=ui();
 if(!selS.length){document.getElementById('recOut').innerHTML='<div class="empty">'+u.recNone+'</div>';return;}
 var scored={};
 for(var ri=0;ri<REC.length;ri++){
  var rule=REC[ri],hit=false;
  for(var si=0;si<rule.s.length;si++){if(selS.indexOf(rule.s[si])>=0){hit=true;break;}}
  if(!hit)continue;
  for(var ii=0;ii<rule.ids.length;ii++){
   var id=rule.ids[ii];
   if(!scored[id])scored[id]={score:0,why:[]};
   scored[id].score++;
   var why=lang==='zh'?rule.zh:rule.en;
   if(scored[id].why.indexOf(why)<0)scored[id].why.push(why);
  }
 }
 var sorted=[];for(var key in scored)sorted.push([key,scored[key]]);
 sorted.sort(function(a,b){return b[1].score-a[1].score;});sorted=sorted.slice(0,6);
 if(!sorted.length){document.getElementById('recOut').innerHTML='<div class="empty">'+u.recEmpty+'</div>';return;}
 var html='<div style="font-size:13px;font-weight:500;color:#111;margin-bottom:10px">'+u.recHead+'</div>';
 for(var ri2=0;ri2<sorted.length;ri2++){
  var id2=sorted[ri2][0],data=sorted[ri2][1];
  var p=null;for(var pi=0;pi<P.length;pi++){if(P[pi].id===id2){p=P[pi];break;}}
  if(!p)continue;
  html+='<div class="rec"><div class="rec-match">'+u.recMatch(data.score)+'</div>'
   +'<div class="rec-name" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="pcode">'+p.code+'</span>'+getName(p)+' <span style="font-size:11px;font-weight:400;color:#aaa">('+p.pkg+')</span></div>'
   +'<div class="rec-why">'+data.why[0]+'</div>'
   +'<button class="rec-btn" onclick="showProd(\''+id2+'\')">'+u.recView+'</button></div>';
 }
 document.getElementById('recOut').innerHTML=html;
}

  timing:{en:'Use at first sign of Phytophthora / root rot pressure, or preventively during wet season. Also provides K during fruit filling.',zh:'发现疫霉病/根腐病迹象时立即使用，或在雨季预防性施用。膨果期同时提供钾素营养。'},

  tip:{en:'Note: phosphonate is NOT the same as phosphate — it cannot be used by the plant as a P fertilizer but provides systemic anti-Phytophthora activity.',zh:'注意：亚磷酸盐不同于磷酸盐——植物无法将其作为磷素肥料利用，但具有系统性抗疫霉活性。'}

function doCalc(){
 var u=ui();
 var pid=document.getElementById('calcProduct').value;
 var method=document.getElementById('calcMethod').value;
 var size=parseFloat(document.getElementById('fieldSize').value)||1;
 var unit=document.getElementById('fieldUnit').value;
 // Save settings
 try{localStorage.setItem('ll_pid',pid);localStorage.setItem('ll_method',method);localStorage.setItem('ll_size',size);localStorage.setItem('ll_unit',unit);var tc=document.getElementById('treeCount').value;if(tc)localStorage.setItem('ll_trees',tc);var ts=document.getElementById('tankSize').value;localStorage.setItem('ll_tank',ts);var nt=document.getElementById('numTanks').value;if(nt)localStorage.setItem('ll_numtanks',nt);}catch(e){}
 var acres=unit==='hectares'?r1(size*2.471):size;
 var tsEl=document.getElementById('tankSize');
 var tankL=tsEl.value==='custom'?(parseFloat(document.getElementById('tankCustom').value)||15):parseFloat(tsEl.value);
 document.getElementById('tankCustom').style.display=tsEl.value==='custom'?'':'none';
 var d=DD[pid];if(!d){document.getElementById('calcOut').innerHTML='';return;}
 var m=d[method];
 var p=null;for(var i=0;i<P.length;i++){if(P[i].id===pid){p=P[i];break;}}
 // Determine if this product uses dilution-based (tank) mode or area-rate mode
 var isDilutionBased=m&&m.dil&&m.dil!=='N/A'&&m.dil.indexOf('N/A')<0;
 var isGranularProduct=['LV025','LV064','LV046','LV047'].indexOf(pid)>=0;
 // Show/hide rows based on product type
 var fieldSizeRow=document.getElementById('fieldSizeRow');
 var numTanksRow=document.getElementById('numTanksRow');
 var treeCountRowEl=document.getElementById('treeCountRow');
 var methodRowEl=document.querySelector('.crow:has(#calcMethod)');
 // Granular: hide farm size + tank count + method; show only tree count

 if(fieldSizeRow)fieldSizeRow.style.display=isGranularProduct?'none':'';
 if(numTanksRow)numTanksRow.style.display=(isDilutionBased&&!isGranularProduct&&pid!=='LV056')?'':'none';
 if(methodRowEl)methodRowEl.style.display=isGranularProduct?'none':'';
 // For dilution-based: use numTanks from input
 var numTanks=isDilutionBased&&!isGranularProduct&&pid!=='LV056'?(parseInt(document.getElementById('numTanks').value)||null):null;
 // ── Growth stage selector ─────────────────────────────────────────────────
 var gsData=GROWTH_STAGES[pid]||null;
 var gsRow=document.getElementById('growthStageRow');
 var gsSelect=document.getElementById('growthStage');
 if(gsRow)gsRow.style.display=gsData?'':'none';
 if(gsData&&gsSelect){
  var gsVal=gsSelect.value;
  // Repopulate if product changed
  if(gsSelect.dataset.pid!==pid){
   gsSelect.innerHTML='';
   gsData.stages.forEach(function(s,i){

   });
   gsSelect.dataset.pid=pid;

  var gsIdx=parseInt(gsSelect.value)||0;

   document.getElementById('calcOut').innerHTML=
    '<div class="cgrp"><div class="ctitle" style="color:#DC2626">\u26a0\ufe0f '+(lang==='zh'?'\u4e0d\u5efa\u8bae\u4f7f\u7528':'Not recommended at this stage')+'</div>'

     ?(pid==='LV055'?'<strong>LV055 \u795e\u4ed9\u6c34</strong>\u5728\u65fa\u957f\u671f\u548c\u8f6c\u8272\u671f\u4e0d\u5efa\u8bae\u4f7f\u7528\uff0c\u53ef\u80fd\u5f71\u54cd\u6b63\u5e38\u751f\u957f\u8282\u5f8b\u3002\u8bf7\u9009\u62e9\u5176\u4ed6\u9636\u6bb5\u67e5\u770b\u5efa\u8bae\u7528\u91cf\u3002':'')

    +(lang==='zh'?'\u6b64\u9636\u6bb5\u5efa\u8bae\u91c7\u7528\u300c\u53f6\u9762\u5582\u65bd\u300d\u65b9\u5f0f':'Switch to Foliar Spray for this stage')+'</div></div>';
   return;
  }
 }

 var rows='';

 if(m.dil&&m.dil!=='N/A'&&m.dil.indexOf('N/A')<0){

  }else{

   var tm=rv.match(/([\d.]+)[–\-]([\d.]+)\s*(kg|g|L|ml)/);

    var tlo=parseFloat(tm[1]),thi=parseFloat(tm[2]);
    productUnit=tm[3];

  // Pass-through if already a category key

// ── Filter bar drag/swipe-to-scroll ───────────────────────────────────────
(function(){
 var bar=document.getElementById('filterBar');
 if(!bar)return;
 // Set overflow via JS to bypass CSS cascade
 bar.style.overflowX='auto';
 bar.style.webkitOverflowScrolling='touch';
 // Hide scrollbar
 bar.style.scrollbarWidth='none';
 bar.style.msOverflowStyle='none';
 var st=document.createElement('style');
 st.textContent='#filterBar::-webkit-scrollbar{display:none}';
 document.head.appendChild(st);

 // Mouse drag (desktop)
 var isDown=false,startX=0,scrollLeft=0,moved=false;
 bar.addEventListener('mousedown',function(e){
  isDown=true;moved=false;bar.classList.add('dragging');
  startX=e.pageX;scrollLeft=bar.scrollLeft;
 });
 document.addEventListener('mouseup',function(){
  isDown=false;bar.classList.remove('dragging');
 });
 bar.addEventListener('mousemove',function(e){
  if(!isDown)return;
  var dx=e.pageX-startX;
  if(Math.abs(dx)>3)moved=true;
  bar.scrollLeft=scrollLeft-dx;
 });
 // Prevent chip click firing after a drag
 bar.addEventListener('click',function(e){
  if(moved){e.stopPropagation();e.preventDefault();moved=false;}
 },true);

 // Touch swipe (mobile) — manual handling for reliable cross-browser scroll
 var touchStartX=0,touchScrollLeft=0,touchMoved=false;
 bar.addEventListener('touchstart',function(e){
  touchStartX=e.touches[0].clientX;
  touchScrollLeft=bar.scrollLeft;
  touchMoved=false;
 },{passive:true});
 bar.addEventListener('touchmove',function(e){
  var dx=e.touches[0].clientX-touchStartX;
  if(Math.abs(dx)>5){
   touchMoved=true;
   bar.scrollLeft=touchScrollLeft-dx;
   e.preventDefault(); // prevent page scroll while swiping chips
  }
 },{passive:false});
 bar.addEventListener('touchend',function(e){
  if(touchMoved)e.stopPropagation();
 });
})();

// ── Copy result ────────────────────────────────────────────────────────────
function showToast(msg){
 var t=document.getElementById('toast');
 if(!t)return;
 t.textContent=msg;
 t.classList.add('show');
 clearTimeout(showToast._timer);
 showToast._timer=setTimeout(function(){t.classList.remove('show');},2000);
}
function copyResult(){
 var c=window._lastCalc;
 if(!c){showToast(lang==='zh'?'请先计算用量':'Please calculate first');return;}
 var zh=c.zh;
 var NL='\n';
 var lines=[];
 // Header
 lines.push(c.pName);
 lines.push((zh?'包装规格：':'Pack size: ')+c.pkg);
 if(c.growthStageLbl)lines.push((zh?'生长阶段：':'Growth stage: ')+c.growthStageLbl);
 lines.push('');
 // Rate section — parse rows HTML to plain text
 var tmp=document.createElement('div');
 tmp.innerHTML=c.rows;
 var rrows=tmp.querySelectorAll('.cres-row');
 if(rrows.length){
  lines.push(zh?'每英亩用量':'Rate per acre');
  rrows.forEach(function(r){
   var k=(r.querySelector('.cres-k')||{}).textContent||'';
   var v=(r.querySelector('.cres-v')||{}).textContent||'';
   if(k&&v)lines.push(k.trim()+' : '+v.trim());
  });
  lines.push('');
 }
 // Tank steps
 if(c.dil&&c.dilMid){
  lines.push((zh?'选择稀释倍数：':'Dilution ratio: ')+c.dilMid+'x'+(c.dil&&c.dil!==c.dilMid+'x'?' ('+c.dil+')':''));
 }
 if(c.initMixStr){
  lines.push((zh?'每桶加入量：':'Add per tank: ')+c.initMixStr);
  lines.push((zh?'兑水：':'Water: ')+c.tkStr);
  if(c.nTanks){
   if(c.numTanks){
    lines.push((zh?'全场共需喷 '+c.nTanks+' 桶':'Spray '+c.nTanks+' tanks for whole farm'));
   }else{
    lines.push((zh?'喷 '+c.nTanks+' 桶 = 覆盖 '+c.acres+' '+c.acr:'Spray '+c.nTanks+' tanks = '+c.acres+' '+c.acr));
   }
  }
  lines.push('');
 }
 if(c.totalStr&&c.totalStr!=='—'&&!(c.treeCount&&c.treeLines&&c.treeLines.length)){
  lines.push(zh?'需要购买：':'Purchase guide:');
  lines.push((zh?'全场合计需要：':'Total needed: ')+c.totalStr);
  if(c.packs)lines.push((zh?'建议采购：':'Buy: ')+c.packs+' × '+c.pkg);
 }
 // Per-tree section
 if(c.treeCount&&c.treeLines&&c.treeLines.length){
  lines.push('');
  lines.push((zh?'按每棵树计算 ('+c.treeCount+'棵) — ':'Per-tree ('+c.treeCount+' trees) — ')+c.treeAgeLbl);
  c.treeLines.forEach(function(l){lines.push(l);});
 }
 var text=lines.join(NL).trim();
 var btn=document.getElementById('copyBtn');
 function onCopied(){
  if(btn){btn.classList.add('copied');btn.innerHTML='✓ '+(zh?'已复制':'Copied!');}
  showToast(zh?'✓ 计算结果已复制':'✓ Result copied to clipboard');
  setTimeout(function(){if(btn){btn.classList.remove('copied');btn.innerHTML='📋 '+(zh?'复制计算结果':'Copy result');}},2000);
  if(navigator.vibrate)navigator.vibrate(8);
 }
 function execFallback(){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');onCopied();}catch(e){}
  document.body.removeChild(ta);
 }
 if(navigator.clipboard&&window.isSecureContext){
  navigator.clipboard.writeText(text).then(onCopied).catch(execFallback);
 }else{
  execFallback();
 }
}

  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
 },{passive:true});
 screens.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-touchStartX;
  var dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.8)return;
  var active=document.querySelector('.screen.active');
  if(!active)return;
  var cur=active.id.replace('s-','');
  var idx=tabOrder.indexOf(cur);
  var next=dx<0?Math.min(idx+1,tabOrder.length-1):Math.max(idx-1,0);
  if(next===idx)return;
  var navBtns=document.querySelectorAll('.nav-btn');
  showScr(tabOrder[next],navBtns[next]);
 },{passive:true});
})();

// ── Landscape warning i18n ─────────────────────────────────────────────────
function updateLandscapeMsg(){
 var el=document.getElementById('e-landscape');
 if(el)el.textContent=lang==='zh'?'请旋转至竖屏模式':'Please rotate to portrait mode';
}
window.addEventListener('orientationchange',updateLandscapeMsg);

// ── PWA: Install prompt ────────────────────────────────────────────────────
var _deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
 e.preventDefault();
 _deferredInstallPrompt=e;
 var btn=document.getElementById('installBtn');
 if(btn){btn.style.display='flex';}
});
window.addEventListener('appinstalled',function(){
 _deferredInstallPrompt=null;
 var btn=document.getElementById('installBtn');
 if(btn){btn.style.display='none';}
});
function installApp(){
 if(!_deferredInstallPrompt)return;
 _deferredInstallPrompt.prompt();
 _deferredInstallPrompt.userChoice.then(function(){
  _deferredInstallPrompt=null;
  var btn=document.getElementById('installBtn');
  if(btn){btn.style.display='none';}
 });
}

// ── PWA: Service Worker (real file — reliable offline on all browsers incl. iOS) ──
if('serviceWorker' in navigator){
 window.addEventListener('load',function(){
  navigator.serviceWorker.register('sw.js').catch(function(){});
 });
 // Online/offline status indicator
 function updateOnlineStatus(){
  var ind=document.getElementById('offlineInd');
  if(!ind)return;
  ind.style.display=navigator.onLine?'none':'flex';
 }
 window.addEventListener('online',updateOnlineStatus);
 window.addEventListener('offline',updateOnlineStatus);
 window.addEventListener('load',updateOnlineStatus);
}

</script>
